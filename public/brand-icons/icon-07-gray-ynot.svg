<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark gray squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="#2a2a2a"/>
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="107" ry="107" fill="none" stroke="#444444" stroke-width="3"/>
  <!-- YNOT text - white -->
  <text
    x="256" y="216"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif"
    font-style="italic"
    font-weight="900"
    font-size="152"
    fill="white"
    letter-spacing="-3">YNOT</text>
  <!-- RADIO.NET text - light gray -->
  <text
    x="256" y="335"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif"
    font-style="italic"
    font-weight="900"
    font-size="68"
    fill="#bbbbbb">RADIO.NET</text>
</svg>
