<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>
  <!-- Black squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="#111111"/>
  <!-- Giant Y — clipped to squircle -->
  <text
    x="256" y="270"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif"
    font-style="italic"
    font-weight="900"
    font-size="310"
    fill="white"
    clip-path="url(#squircle)">Y</text>
</svg>
