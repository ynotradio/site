# ./docker-compose.yml
networks:
  app-tier:
    driver: bridge

services:
  mysql:
    build:
      context: ./
      dockerfile: ./bin/docker/mysql/Dockerfile
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ynot_site
      MYSQL_USER: ynot_sql_user
      MYSQL_PASSWORD: ynot_sql_pass
    networks:
      - app-tier
    volumes:
      - 'mysqldb_data:/bitnami'
  phpmyadmin:
    image: 'docker.io/bitnami/phpmyadmin:latest'
    ports:
      - '8181:8181'
    depends_on:
      - mysql
    environment:
      - APACHE_HTTP_PORT_NUMBER=8181
      - DATABASE_HOST=mysql
    networks:
      - app-tier
  phpfpm:
    build:
      context: ./
      dockerfile: ./bin/docker/phpfpm/Dockerfile
    restart: unless-stopped
    ports:
      - 9000:9000
    networks:
      - app-tier
    env_file:
      - .env.local
    volumes:
      - ./src:/app
  apache:
    image: docker.io/bitnami/apache:latest
    ports:
      - 8080:8080
    networks:
      - app-tier
    depends_on:
      - mysql
      - phpfpm
    volumes:
      - type: bind
        source: ./bin/docker/apache-vhost/my_vhost.conf
        target: /opt/bitnami/apache/conf/vhosts/my_vhost.conf
      - ./src:/app
  postgres:
    build:
      context: ./
      dockerfile: ./bin/docker/postgres/Dockerfile
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ynot_payload_dev
      POSTGRES_USER: ynot_postgres_user
      POSTGRES_PASSWORD: ynot_postgres_pass
    networks:
      - app-tier
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ynot_postgres_user -d ynot_payload_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mysqldb_data:
    driver: local
  postgres_data:
    driver: local