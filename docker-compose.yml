# ./docker-compose.yml
networks:
  app-tier:
    driver: bridge

services:
  mysql:
    build:
      context: ./
      dockerfile: ./bin/docker/mysql/Dockerfile
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ynot_site
      MYSQL_USER: ynot_sql_user
      MYSQL_PASSWORD: ynot_sql_pass
    networks:
      - app-tier
    volumes:
      - 'mysqldb_data:/var/lib/mysql'
  phpmyadmin:
    image: 'phpmyadmin/phpmyadmin:latest'
    ports:
      - '8181:80'
    depends_on:
      - mysql
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
    networks:
      - app-tier
  phpfpm:
    build:
      context: ./
      dockerfile: ./bin/docker/phpfpm/Dockerfile
    restart: unless-stopped
    ports:
      - 9000:9000
    networks:
      - app-tier
    env_file:
      - .env.local
    environment:
      # Support for libfaketime in tests (set FAKETIME and LD_PRELOAD via env)
      - LD_PRELOAD=${LD_PRELOAD:-}
      - FAKETIME=${FAKETIME:-}
    volumes:
      - ./src:/app
  apache:
    image: httpd:2.4
    ports:
      - 8080:80
    networks:
      - app-tier
    depends_on:
      - mysql
      - phpfpm
    volumes:
      - type: bind
        source: ./bin/docker/apache-vhost/httpd-vhost.conf
        target: /usr/local/apache2/conf/extra/httpd-vhosts.conf
      - ./src:/app
    command: >
      sh -c "echo 'LoadModule proxy_module modules/mod_proxy.so' >> /usr/local/apache2/conf/httpd.conf &&
             echo 'LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so' >> /usr/local/apache2/conf/httpd.conf &&
             echo 'LoadModule rewrite_module modules/mod_rewrite.so' >> /usr/local/apache2/conf/httpd.conf &&
             echo 'Include conf/extra/httpd-vhosts.conf' >> /usr/local/apache2/conf/httpd.conf &&
             httpd-foreground"
  postgres:
    build:
      context: ./
      dockerfile: ./bin/docker/postgres/Dockerfile
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ynot_payload_dev
      POSTGRES_USER: ynot_postgres_user
      POSTGRES_PASSWORD: ynot_postgres_pass
    networks:
      - app-tier
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ynot_postgres_user -d ynot_payload_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
  playwright:
    build:
      context: ./
      dockerfile: ./Dockerfile.playwright
    network_mode: host
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - CI=true
      - NODE_ENV=development
    profiles:
      - test
    command: yarn test:e2e
volumes:
  mysqldb_data:
    driver: local
  postgres_data:
    driver: local