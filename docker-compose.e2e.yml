# docker-compose.e2e.yml
# E2E testing services for Buildkite CI
# Full setup: Postgres + MySQL → Payload + Legacy PHP → Playwright
#
# Uses pre-built GHCR images by default for fast CI.
# Override with environment variables if needed.

services:
  # === PostgreSQL for Payload CMS ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ynot_payload_dev}
      POSTGRES_USER: ${POSTGRES_USER:-ynot_postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_password_not_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ynot_postgres_user} -d ${POSTGRES_DB:-ynot_payload_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # === MySQL for Legacy PHP Site ===
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_root_password_not_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ynot_site}
      MYSQL_USER: ${MYSQL_USER:-ynot_sql_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_mysql_password_not_secret}
    volumes:
      # Seed database with schema on first start
      - ./src/db/docker/ynot_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-ynot_sql_user} -p${MYSQL_PASSWORD:-dev_mysql_password_not_secret} && mysql -u${MYSQL_USER:-ynot_sql_user} -p${MYSQL_PASSWORD:-dev_mysql_password_not_secret} ${MYSQL_DATABASE:-ynot_site} -e 'SELECT 1 FROM stories LIMIT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # === Payload CMS ===
  payload:
    image: ${PAYLOAD_IMAGE:-ghcr.io/ynotradio/site/payload-dev:latest}
    ports:
      - "3000:3000"
    environment:
      - CI=true
      - NODE_ENV=development
      - DATABASE_URI=postgresql://${POSTGRES_USER:-ynot_postgres_user}:${POSTGRES_PASSWORD:-dev_postgres_password_not_secret}@postgres:5432/${POSTGRES_DB:-ynot_payload_dev}
      - DATABASE_SSL=disable
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-dev_payload_secret_not_for_production}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -x
        echo '=== Payload container starting ==='
        node --version
        
        # WORKAROUND: DinD esbuild version mismatch
        cd node_modules/tsx/node_modules
        rm -rf esbuild @esbuild
        npm pack esbuild-wasm@0.27.3 2>&1
        mkdir esbuild && tar -xzf esbuild-wasm-*.tgz -C esbuild --strip-components=1
        rm -f esbuild-wasm-*.tgz
        cd /app
        
        echo '=== Starting Payload ==='
        yarn payload:migrate
        # Run seed directly (yarn script may not be found if Docker layer cached old package.json)
        npx tsx --import ./bin/preload-nextenv-fix.mjs bin/seed-mrm-fresh.ts || {
          echo '=== SEED FAILED — aborting container ==='
          exit 1
        }
        
        # Trap signals to prevent unexpected exits
        trap 'echo "Received SIGTERM, ignoring..."' TERM
        trap 'echo "Received SIGINT, ignoring..."' INT
        trap 'echo "Received SIGHUP, ignoring..."' HUP
        
        # Keep a background process alive
        tail -f /dev/null &
        
        # CRITICAL: Next.js dev server exits when stdin closes in detached containers
        # Pipe `yes` to stdin to keep it alive. Restart loop provides resilience.
        while true; do
          echo "Starting Next.js dev server..."
          yes 2>/dev/null | yarn dev --port 3000 2>&1 || true
          echo "Next.js exited (code $?), restarting in 1 second..."
          sleep 1
        done
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  # === PHP-FPM for Legacy Site ===
  # Uses pre-built image with extensions compiled
  phpfpm:
    image: ${PHPFPM_IMAGE:-ghcr.io/ynotradio/site/phpfpm-dev:latest}
    working_dir: /app
    volumes:
      - ./src:/app
    environment:
      # MySQL connection
      - DB_HOST=mysql
      - DB_USER=${MYSQL_USER:-ynot_sql_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-dev_mysql_password_not_secret}
      - DB_NAME=${MYSQL_DATABASE:-ynot_site}
      - DB_PORT=3306
      # PostgreSQL connection
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=${POSTGRES_DB:-ynot_payload_dev}
      - POSTGRES_USER=${POSTGRES_USER:-ynot_postgres_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev_postgres_password_not_secret}
      - USE_POSTGRES_SCHEDULE=false
      # Auth0 dummy config
      - AUTH0_DOMAIN=test.auth0.com
      - AUTH0_CLIENT_ID=test-client-id
      - AUTH0_CLIENT_SECRET=test-client-secret
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "composer install --no-interaction --no-dev && php-fpm"]
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # === Apache for Legacy Site ===
  apache:
    image: httpd:2.4
    ports:
      - "8080:80"
    volumes:
      - ./src:/app
      - ./bin/docker/apache-vhost/httpd-vhost.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf
    depends_on:
      phpfpm:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: >
      sh -c "
        apt-get update && apt-get install -y curl &&
        echo 'LoadModule proxy_module modules/mod_proxy.so' >> /usr/local/apache2/conf/httpd.conf &&
        echo 'LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so' >> /usr/local/apache2/conf/httpd.conf &&
        echo 'LoadModule rewrite_module modules/mod_rewrite.so' >> /usr/local/apache2/conf/httpd.conf &&
        echo 'Include conf/extra/httpd-vhosts.conf' >> /usr/local/apache2/conf/httpd.conf &&
        httpd-foreground
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost/ | grep -qE '^[2345]' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # === Playwright E2E Tests ===
  # Uses pre-built image with npm deps installed
  playwright:
    image: ${PLAYWRIGHT_IMAGE:-ghcr.io/ynotradio/site/playwright:latest}
    working_dir: /app
    volumes:
      - ./e2e:/app/e2e:ro
      - ./playwright.config.ts:/app/playwright.config.ts:ro
    environment:
      - CI=true
      - SKIP_PAYLOAD_SEED=true
      - PLAYWRIGHT_BASE_URL=http://payload:3000
      - PLAYWRIGHT_LEGACY_URL=http://apache:80
    depends_on:
      payload:
        condition: service_healthy
      apache:
        condition: service_healthy
    # Chromium uses its own DNS resolver, so we add service IPs to /etc/hosts
    command: >
      bash -c "
        PAYLOAD_IP=$$(getent hosts payload | awk '{print $$1}')
        APACHE_IP=$$(getent hosts apache | awk '{print $$1}')
        [ -n \"$$PAYLOAD_IP\" ] && echo \"$$PAYLOAD_IP payload\" >> /etc/hosts
        [ -n \"$$APACHE_IP\" ] && echo \"$$APACHE_IP apache\" >> /etc/hosts
        npx playwright test --reporter=list
      "
