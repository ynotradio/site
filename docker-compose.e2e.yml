# docker-compose.e2e.yml
# E2E testing services for Buildkite CI
# Usage: docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.e2e.yml up

services:
  # Payload CMS / Next.js server for E2E tests
  payload:
    container_name: payload
    image: node:22-slim
    working_dir: /app
    tty: true
    stdin_open: true
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - CI=true
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    # Install curl for healthcheck, yarn deps, then start dev server with node directly
    # Using node directly instead of yarn to avoid yarn exiting
    command: >
      bash -c "apt-get update && apt-get install -y curl &&
               yarn --ignore-engines install --frozen-lockfile &&
               node node_modules/.bin/next dev"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/admin || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks:
      - app-tier

  # Playwright test runner - uses bridge network with explicit IP
  playwright:
    container_name: playwright
    image: mcr.microsoft.com/playwright:v1.58.0-jammy
    # Override network_mode from base compose (was host mode) with bridge (empty = default)
    network_mode: ""
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - CI=true
      - NODE_ENV=development
      # Skip seeding in global-setup since we seed via payload container
      - SKIP_PAYLOAD_SEED=true
      # PLAYWRIGHT_BASE_URL will be set dynamically in pipeline with payload IP
      - PLAYWRIGHT_LEGACY_URL=http://apache:80
    depends_on:
      payload:
        condition: service_healthy
    # Install deps and run tests - has network access for npm
    command: >
      bash -c "yarn install --frozen-lockfile && 
               echo 'Running Playwright tests with base URL:' && 
               echo $$PLAYWRIGHT_BASE_URL && 
               npx playwright test --reporter=list"
