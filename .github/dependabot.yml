updates:
- commit-message:
    include: scope
    prefix: chore
    prefix-development: chore
  directory: /
  groups:
    dnd-kit:
      patterns:
      - "@dnd-kit/*"
    mcp:
      patterns:
      - "@sanity/mcp-server"
      - "@benborla29/mcp-server-mysql"
      - "@modelcontextprotocol/*"
      - mcp-*
    netlify:
      patterns:
      - "@netlify/*"
    nextjs:
      patterns:
      - next
      - eslint-config-next
    payload:
      patterns:
      - payload
      - "@payloadcms/*"
    react:
      patterns:
      - react
      - react-*
      - "@types/react"
    sanity:
      patterns:
      - sanity
      - "@sanity/*"
    storybook:
      patterns:
      - storybook
      - "@storybook/*"
      - "@chromatic-com/storybook"
    testing:
      patterns:
      - "@testing-library/*"
      - vitest
      - "@vitest/*"
      - jsdom
      - "@playwright/test"
    tooling:
      patterns:
      - typescript
      - eslint
      - eslint-*
      - "@typescript-eslint/*"
      - prettier
      - husky
      - lint-staged
      - ts-node
      - tsx
  ignore:
  - dependency-name: "@sanity/eslint-config-studio"
    update-types:
    - version-update:semver-major
  - dependency-name: "eslint"
    update-types:
    - version-update:semver-major
  - dependency-name: "@typescript-eslint/eslint-plugin"
    update-types:
    - version-update:semver-major
  - dependency-name: "@typescript-eslint/parser"
    update-types:
    - version-update:semver-major
  - dependency-name: "eslint-config-next"
    update-types:
    - version-update:semver-major
  - dependency-name: "@types/node"
    update-types:
    - version-update:semver-major
  labels:
  - dependencies
  - automated
  open-pull-requests-limit: 10
  package-ecosystem: npm
  rebase-strategy: auto
  schedule:
    interval: monthly
- commit-message:
    include: scope
    prefix: chore
  directory: /
  groups:
    github-actions:
      patterns:
      - "*"
  ignore:
  - dependency-name: "github/gh-aw-actions"
  - dependency-name: "github/gh-aw"
  - dependency-name: "github/gh-aw-actions/**" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  labels:
  - dependencies
  - github-actions
  - automated
  open-pull-requests-limit: 5
  package-ecosystem: github-actions
  rebase-strategy: auto
  schedule:
    interval: monthly
version: 2
