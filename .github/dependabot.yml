version: 2
updates:
  # Keep npm dependencies up to date
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Ignore major versions that are incompatible with current ESLint version
    # ESLint 8 is intentionally kept due to eslint-config-airbnb-typescript not supporting ESLint 9's flat config
    ignore:
      # @sanity/eslint-config-studio v5+ requires ESLint 9
      - dependency-name: "@sanity/eslint-config-studio"
        update-types: ["version-update:semver-major"]
      # ESLint 9 uses flat config which is incompatible with current setup
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint v8 requires ESLint 9
      - dependency-name: "@typescript-eslint/eslint-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/parser"
        update-types: ["version-update:semver-major"]
      # eslint-config-next v16+ requires Next.js 16 and ESLint 9
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # @types/node should stay aligned with project's Node version (currently using v22 types)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Group updates to reduce PR noise
    groups:
      # Group all Payload CMS packages together (they version in lockstep)
      payload:
        patterns:
          - "payload"
          - "@payloadcms/*"
      # Group all Sanity-related packages together
      sanity:
        patterns:
          - "sanity"
          - "@sanity/*"
      # Group React packages together
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react"
      # Group Next.js and its ecosystem together
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      # Group Storybook packages together
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "@chromatic-com/storybook"
      # Group testing libraries together
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
          - "@playwright/test"
      # Group TypeScript and ESLint tooling together
      tooling:
        patterns:
          - "typescript"
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "prettier"
          - "husky"
          - "lint-staged"
          - "ts-node"
          - "tsx"
      # Group DnD-kit packages together
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
      # Group Netlify packages together
      netlify:
        patterns:
          - "@netlify/*"
      # Group MCP server packages together
      mcp:
        patterns:
          - "@sanity/mcp-server"
          - "@benborla29/mcp-server-mysql"
          - "@modelcontextprotocol/*"
          - "mcp-*"
    # Automatically rebase PRs when they become out of date
    rebase-strategy: "auto"
    # Limit open PRs to avoid overwhelming the team
    open-pull-requests-limit: 10
    # Add labels for easier identification
    labels:
      - "dependencies"
      - "automated"
    # Prefix commit messages
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # gh-aw-actions is pinned inside compiled .lock.yml files generated by
    # `gh aw compile`. Dependabot must not touch these — run `gh aw upgrade`
    # instead, which bumps the action AND recompiles the lock files together.
    ignore:
      - dependency-name: "github/gh-aw-actions"
      - dependency-name: "github/gh-aw"
    # Group all GitHub Actions updates together
    groups:
      github-actions:
        patterns:
          - "*"
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
