name: Deploy preview on label

# Request a Netlify preview from the GitHub UI (including mobile) by applying
# the `preview` label to a PR — no branch renaming required.
#
# How it works:
#   Netlify is configured to deploy branches matching `preview/*` (Project
#   configuration → Build & deploy → Branches and deploy contexts). When the
#   `preview` label is applied, this workflow mirrors the PR's head commit to a
#   `preview/pr-<number>` branch. That push matches `preview/*`, so Netlify
#   builds it under the branch-deploy context (see netlify.toml) and publishes
#   it at https://preview-pr-<number>--ynotradio-admin.netlify.app.
#
# Notes:
#   - The mirror branch is force-updated on each label, so re-applying `preview`
#     after new commits refreshes the deploy to the latest head.
#   - The branch (and its Netlify deploy) is removed when the PR closes.
#   - The push is made with the built-in GITHUB_TOKEN; Netlify's webhook fires
#     on any push, so no build hook or extra secret is needed.

on:
  pull_request:
    types: [labeled, closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # Mirror the PR head to preview/pr-<n> when the `preview` label is applied.
  open-preview:
    if: github.event.action == 'labeled' && github.event.label.name == 'preview'
    runs-on: ubuntu-latest
    steps:
      - name: Mirror PR head to preview branch
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const branch = `preview/pr-${pr}`;
            const ref = `heads/${branch}`;

            // Create the branch, or fast-forward/reset it to the current head.
            try {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha,
                force: true,
              });
            } catch (e) {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${ref}`,
                sha,
              });
            }

            // Remove the label so re-applying it later re-triggers a refresh.
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              name: 'preview',
            }).catch(() => {});

            const url = `https://preview-pr-${pr}--ynotradio-admin.netlify.app`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: [
                `🌐 Preview requested — mirrored \`${sha.slice(0, 7)}\` to \`${branch}\`.`,
                ``,
                `Netlify will build it (matches \`preview/*\`) at ${url}`,
                ``,
                `Re-apply the **preview** label after new commits to refresh it. The branch and its deploy are removed when this PR closes.`,
              ].join('\n'),
            });

  # Tear down the preview branch (and its Netlify deploy) when the PR closes.
  close-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview branch if it exists
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const ref = `heads/preview/pr-${pr}`;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
              });
              core.info(`Deleted preview/pr-${pr}`);
            } catch (e) {
              core.info(`No preview branch to delete: ${e.message}`);
            }
