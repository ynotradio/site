name: E2E Tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    
    # Use Playwright container with pre-installed browsers
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    
    # Run service containers for databases and legacy site
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ynot_payload_dev
          POSTGRES_USER: ynot_postgres_user
          POSTGRES_PASSWORD: ynot_postgres_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ynot_site
          MYSQL_USER: ynot_sql_user
          MYSQL_PASSWORD: ynot_sql_pass
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      # No need to install Playwright browsers - already in container!
      
      # Setup Next.js build cache
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-
            ${{ runner.os }}-nextjs-
      
      - name: Setup environment file
        run: |
          cp .env.example .env.local
          # Use service container databases (accessible via service names)
          echo "DATABASE_URI=postgresql://ynot_postgres_user:ynot_postgres_pass@postgres:5432/ynot_payload_dev" >> .env.local
          echo "PAYLOAD_SECRET=test-secret-for-ci" >> .env.local
          echo "PAYLOAD_PUBLIC_SERVER_URL=http://localhost:3000" >> .env.local
          echo "PORT=3000" >> .env.local
      
      - name: Wait for services
        run: |
          echo "Services are ready (health checks passed)"
          # PostgreSQL and MySQL are already healthy from service definitions
      
      - name: Seed databases
        run: |
          # Seed Payload Postgres database
          yarn payload:seed || echo "Payload seed not available, continuing..."
          # Seed legacy MySQL database
          yarn seed:legacy || echo "Legacy seed not available, continuing..."
      
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

