name: E2E Tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      
      # Setup Next.js build cache
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-
            ${{ runner.os }}-nextjs-
      
      # Cache Composer dependencies
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      
      - name: Setup environment file
        run: |
          cp .env.example .env.local
          # Configure for Payload CMS with Postgres
          echo "DATABASE_URI=postgresql://ynot_postgres_user:ynot_postgres_pass@localhost:5432/ynot_payload_dev" >> .env.local
          echo "POSTGRES_HOST=postgres" >> .env.local
          echo "POSTGRES_PORT=5432" >> .env.local
          echo "POSTGRES_DB=ynot_payload_dev" >> .env.local
          echo "POSTGRES_USER=ynot_postgres_user" >> .env.local
          echo "POSTGRES_PASSWORD=ynot_postgres_pass" >> .env.local
          # Configure for legacy PHP site with MySQL (inside Docker network)
          echo "DB_HOST=mysql" >> .env.local
          echo "DB_PORT=3306" >> .env.local
          echo "DB_NAME=ynot_site" >> .env.local
          echo "DB_USER=root" >> .env.local
          echo "DB_PASSWORD=root" >> .env.local
          # Auth0 configuration (dummy values for E2E tests)
          echo "AUTH0_DOMAIN=test.auth0.com" >> .env.local
          echo "AUTH0_CLIENT_ID=test_client_id" >> .env.local
          echo "AUTH0_CLIENT_SECRET=test_client_secret" >> .env.local
      
      - name: Install PHP dependencies
        run: |
          cd src
          composer install --no-dev --optimize-autoloader
      
      - name: Start Docker Compose services
        run: |
          docker compose up -d postgres mysql phpfpm apache
          echo "Waiting for services to be ready..."
      
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U ynot_postgres_user -d ynot_payload_dev > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
      
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T -e MYSQL_PWD=root mysql mysqladmin ping -h localhost -u root > /dev/null 2>&1; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
      
      - name: Initialize MySQL database schema
        run: |
          # Wait a bit more for MySQL to be fully ready
          sleep 5
          # Create database and verify it worked
          echo "Creating database..."
          if docker compose exec -T mysql bash -c 'MYSQL_PWD=root mysql -u root -e "CREATE DATABASE IF NOT EXISTS ynot_site;"'; then
            echo "✅ Database created"
          else
            echo "❌ Failed to create database"
            exit 1
          fi
          # Import schema if available
          if [ -f "src/db/docker/ynot_db.sql" ]; then
            echo "Importing MySQL schema..."
            docker compose exec -T mysql bash -c 'MYSQL_PWD=root mysql -u root ynot_site' < src/db/docker/ynot_db.sql
            echo "✅ Schema imported successfully"
          else
            echo "⚠️  Warning: Schema file not found, seeding may fail"
          fi
      
      - name: Wait for Apache
        run: |
          echo "Waiting for Apache to be ready..."
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 | grep -q "200\|301\|302"; then
              echo "Apache is ready"
              break
            fi
            echo "Waiting for Apache... ($i/30)"
            sleep 2
          done
      
      - name: Seed legacy MySQL database
        run: |
          # Seed MySQL with test data for the legacy PHP site
          yarn seed:legacy
      
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v

