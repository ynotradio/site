name: E2E Tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      
      # Setup Next.js build cache
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-
            ${{ runner.os }}-nextjs-
      
      - name: Setup environment file
        run: |
          cp .env.example .env.local
          # Use local Docker Compose databases
          echo "DATABASE_URI=postgresql://ynot_postgres_user:ynot_postgres_pass@localhost:5432/ynot_payload_dev" >> .env.local
          echo "PAYLOAD_SECRET=test-secret-for-ci" >> .env.local
          echo "PAYLOAD_PUBLIC_SERVER_URL=http://localhost:3000" >> .env.local
          echo "PORT=3000" >> .env.local
      
      - name: Start Docker Compose services
        run: |
          docker compose up -d postgres mysql apache
          echo "Waiting for services to be ready..."
      
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U ynot_postgres_user -d ynot_payload_dev > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
      
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T mysql mysqladmin ping -h localhost -u root -proot > /dev/null 2>&1; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
      
      - name: Wait for Apache
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080 > /dev/null 2>&1; then
              echo "Apache is ready"
              break
            fi
            echo "Waiting for Apache... ($i/30)"
            sleep 2
          done
      
      - name: Seed databases
        run: |
          # Seed Payload Postgres database
          yarn payload:seed || echo "Payload seed not available, continuing..."
          # Seed legacy MySQL database
          yarn seed:legacy || echo "Legacy seed not available, continuing..."
      
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v

