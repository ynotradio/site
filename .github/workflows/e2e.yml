name: E2E Tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    
    # Use Playwright container with pre-installed browsers
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      # No need to install Playwright browsers - already in container!
      
      - name: Setup environment file
        run: |
          cp .env.example .env.local
          # Set Postgres feature flags for PHP legacy site
          echo "USE_POSTGRES_CONCERTS=true" >> .env.local
          echo "USE_POSTGRES_ONDEMAND=true" >> .env.local
          echo "USE_POSTGRES_DEEJAYS=true" >> .env.local
          echo "USE_POSTGRES_MUSIC=true" >> .env.local
          echo "USE_POSTGRES_STORIES=true" >> .env.local
          echo "USE_POSTGRES_CDOFTHEWEEK=true" >> .env.local
          echo "USE_POSTGRES_SCHEDULE=true" >> .env.local
          echo "USE_POSTGRES_CUSTOMTEXT=true" >> .env.local
          # Set Neon database URL (use production/seeded database)
          echo "DATABASE_URI=${{ secrets.DATABASE_URI }}" >> .env.local
          echo "POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}" >> .env.local
          echo "POSTGRES_DATABASE=${{ secrets.POSTGRES_DATABASE }}" >> .env.local
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env.local
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env.local
          echo "POSTGRES_SSL_MODE=require" >> .env.local
          echo "PAYLOAD_SECRET=test-secret-for-ci" >> .env.local
      
      - name: Start Docker services
        run: |
          docker compose up -d
          echo "Waiting for services to be ready..."
      
      - name: Wait for services
        run: |
          # Wait for MySQL
          for i in {1..30}; do
            if docker compose exec -T mysql mysqladmin ping -h localhost -u root -proot > /dev/null 2>&1; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          
          # Wait for Apache
          for i in {1..30}; do
            if curl -f http://localhost:8080 > /dev/null 2>&1; then
              echo "Apache is ready"
              break
            fi
            echo "Waiting for Apache... ($i/30)"
            sleep 2
          done
      
      - name: Seed MySQL database
        run: |
          yarn seed:legacy || echo "Legacy seed failed, continuing..."
      
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          docker system prune -f
