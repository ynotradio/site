name: E2E Tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    
    # Use Playwright container with pre-installed browsers
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      # No need to install Playwright browsers - already in container!
      
      - name: Setup environment file
        run: |
          cp .env.example .env.local
          # Set Neon database URL (use production/seeded database)
          echo "DATABASE_URI=${{ secrets.DATABASE_URI }}" >> .env.local
          echo "DATABASE_SSL=require" >> .env.local
          echo "PAYLOAD_SECRET=test-secret-for-ci" >> .env.local
          echo "PAYLOAD_PUBLIC_SERVER_URL=http://localhost:3000" >> .env.local
          echo "PORT=3000" >> .env.local
      
      # Skip Docker services in CI - we connect to remote Neon database instead
      # The test will only validate Payload CMS (not legacy PHP site) in CI
      
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      
      # No cleanup needed - no Docker containers in CI
