version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload"]
      interval: 5s
      timeout: 5s
      retries: 5

  payload:
    build:
      context: .
      dockerfile: Dockerfile.payload
    ports:
      - "3000:3000"
    environment:
      DATABASE_URI: postgresql://payload:payload@postgres:5432/payload_dev
      PAYLOAD_SECRET: automated-agent-secret-key-change-in-production
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3000
      NODE_ENV: development
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./payload:/app/payload
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - node_modules:/app/node_modules

volumes:
  postgres_data:
  node_modules:
