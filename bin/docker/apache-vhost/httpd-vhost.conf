<VirtualHost *:80>
  ServerName local.ynotradio.net
  DocumentRoot "/app"
  
  ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://phpfpm:9000/app/$1
  <Directory "/app">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
  </Directory>
</VirtualHost>
