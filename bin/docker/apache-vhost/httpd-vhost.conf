<VirtualHost *:80>
  ServerName local.ynotradio.net
  DocumentRoot "/app"

  <Directory "/app">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
  </Directory>

  <FilesMatch \.php$>
    SetHandler "proxy:fcgi://phpfpm:9000"
    ProxyFCGISetEnvIf true SCRIPT_FILENAME "%{REQUEST_FILENAME}"
  </FilesMatch>
</VirtualHost>
