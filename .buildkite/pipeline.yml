  # === E2E Integration Tests ===
  - label: ":playwright: E2E Tests"
    key: "e2e"
    timeout_in_minutes: 15
    command: |
      echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USERNAME" --password-stdin
      
      # Pull images in parallel, build Payload locally (esbuild binary mismatch in DinD)
      docker pull ghcr.io/ynotradio/site/phpfpm-dev:latest &
      docker pull ghcr.io/ynotradio/site/playwright:latest &
      docker build -t ghcr.io/ynotradio/site/payload-dev:latest -f Dockerfile.payload . &
      wait
      
      # Start databases (detached is OK for these)
      docker compose -f docker-compose.e2e.yml up -d postgres mysql
      
      # Start Payload in FOREGROUND (backgrounded) to enable TTY attachment
      # tty: true in docker-compose only works with attached mode
      docker compose -f docker-compose.e2e.yml up payload 2>&1 &
      COMPOSE_PID=$$!
      
      # Wait for services to be healthy
      echo "⏳ Waiting for services..."
      for i in $$(seq 1 60); do
        PAYLOAD=$$(docker compose -f docker-compose.e2e.yml ps payload --format json | jq -r '.Health // "starting"')
        echo "Check $$i/60: payload=$$PAYLOAD"
        [ "$$PAYLOAD" = "healthy" ] && break
        sleep 5
      done
      
      # Kill the foreground compose (container keeps running)
      kill $$COMPOSE_PID 2>/dev/null || true
      
      # Start remaining services
      docker compose -f docker-compose.e2e.yml up -d phpfpm apache
      
      # Wait for Apache to be healthy
      for i in $$(seq 1 30); do
        APACHE=$$(docker compose -f docker-compose.e2e.yml ps apache --format json | jq -r '.Health // "starting"')
        echo "Apache check $$i/30: apache=$$APACHE"
        [ "$$APACHE" = "healthy" ] && break
        sleep 5
      done
      
      # Run tests
      docker compose -f docker-compose.e2e.yml run --rm playwright
      TEST_EXIT=$$?
      
      docker compose -f docker-compose.e2e.yml down -v
      exit $$TEST_EXIT
    env:
      GHCR_USERNAME: "${GHCR_USERNAME}"
      GHCR_TOKEN: "${GHCR_TOKEN}"
    artifact_paths:
      - "test-results/**/*"
      - "playwright-report/**/*"
    agents:
      queue: "default"
      docker: "true"
