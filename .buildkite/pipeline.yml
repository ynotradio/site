# Buildkite Pipeline for Y-Not Radio Site
# 
# ITERATION MODE: Only E2E tests while debugging Playwright in Buildkite
# Other steps (ESLint, Vitest, Storybook, PHP Lint) temporarily disabled

env:
  CI: "true"

steps:
  # Step 1: External site test (validates Playwright works)
  - label: ":playwright: E2E Tests (External Site)"
    key: "e2e-external"
    timeout_in_minutes: 5
    command: |
      cd e2e-buildkite && \
      npm install && \
      npx playwright test --reporter=list --grep="external"
    plugins:
      - docker#v5.11.0:
          image: "mcr.microsoft.com/playwright:v1.58.2-noble"
          propagate-environment: true
    artifact_paths:
      - "e2e-buildkite/test-results/**/*"
    agents:
      queue: "default"

  # Step 2: Payload CMS test (local services)
  - label: ":payload: E2E Tests (Payload CMS)"
    key: "e2e-payload"
    depends_on: "e2e-external"
    timeout_in_minutes: 15
    command: |
      echo "🚀 Starting Payload services..."
      cd e2e-buildkite
      
      # Start without --wait so we can see logs
      docker compose up -d
      
      # Wait for postgres to be healthy
      echo "⏳ Waiting for postgres..."
      for i in {1..30}; do
        if docker compose exec -T postgres pg_isready -U ynot_postgres_user -d ynot_payload_dev; then
          echo "✅ Postgres ready"
          break
        fi
        sleep 2
      done
      
      # Show payload logs and wait for it
      echo "📋 Tailing Payload logs (waiting for healthy)..."
      
      # Wait for payload to be healthy or fail
      for i in {1..60}; do
        STATUS=$$(docker compose ps payload --format json | jq -r '.State // "unknown"')
        HEALTH=$$(docker compose ps payload --format json | jq -r '.Health // "none"')
        echo "[$i/60] Payload status: $$STATUS, health: $$HEALTH"
        
        if [ "$$STATUS" = "exited" ]; then
          echo "❌ Payload exited!"
          docker compose logs payload | tail -100
          docker compose down
          exit 1
        fi
        
        if [ "$$HEALTH" = "healthy" ]; then
          echo "✅ Payload healthy!"
          break
        fi
        
        sleep 5
      done
      
      # Get Payload container IP for Playwright to use
      PAYLOAD_IP=$$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' e2e-buildkite-payload-1)
      echo "📍 Payload container IP: $$PAYLOAD_IP"
      
      # Verify curl from host can reach Payload via port mapping
      echo "🔍 Testing connectivity to localhost:3000..."
      curl -sf http://localhost:3000/admin/login > /dev/null && echo "✅ curl localhost:3000 works" || echo "⚠️ localhost:3000 not reachable"
      
      echo "🧪 Running Playwright tests..."
      # Run Playwright with host network to reach localhost:3000
      docker run --rm --network=host \
        -v "$$(pwd)/..:/app" -w /app/e2e-buildkite \
        -e CI=true \
        -e PAYLOAD_URL=http://localhost:3000 \
        mcr.microsoft.com/playwright:v1.58.2-noble \
        bash -c "npm install && npx playwright test --reporter=list --grep='local'"
      
      echo "🧹 Cleanup..."
      docker compose down
    artifact_paths:
      - "e2e-buildkite/test-results/**/*"
    agents:
      queue: "default"
