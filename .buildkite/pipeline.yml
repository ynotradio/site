# Buildkite Pipeline for Y-Not Radio Site
# This pipeline replaces GitHub Actions CI workflow
# TEMPORARY: E2E-only mode for fast iteration

env:
  NODE_VERSION: "22"
  PHP_VERSION: "7.4"
  CI: "true"

steps:
  # E2E Tests - TEMPORARY: Running first for fast feedback
  - label: ":playwright: E2E Tests"
    key: "e2e"
    timeout_in_minutes: 30
    env:
      CI: "true"
      COMPOSE_FILE: "docker-compose.yml:docker-compose.ci.yml:docker-compose.e2e.yml"
    commands:
      # Pre-setup: Login to GHCR for pulling images
      - export GHCR_USERNAME=$$(buildkite-agent secret get GHCR_USERNAME)
      - export GHCR_TOKEN=$$(buildkite-agent secret get GHCR_TOKEN)
      - echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USERNAME" --password-stdin
      
      # Clean up any leftover containers from previous runs
      - docker compose down -v 2>/dev/null || true
      
      # Setup E2E environment files
      - ./bin/setup-e2e-env.sh
      
      # Install composer dependencies
      - docker run --rm -v "$$(pwd)/src:/app" -w /app composer:2 composer install --no-dev --optimize-autoloader
      
      # Start all backend services (databases, Apache, PHP)
      - docker compose up -d mysql postgres phpfpm apache
      - ./bin/wait-for-docker-services.sh
      
      # Initialize MySQL
      - docker compose exec -T mysql mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS ynotradio;"
      - docker compose exec -T mysql mysql -uroot -proot -e "CREATE USER IF NOT EXISTS 'ynotradio'@'%' IDENTIFIED BY 'ynotradio'; GRANT ALL PRIVILEGES ON ynotradio.* TO 'ynotradio'@'%'; FLUSH PRIVILEGES;"
      
      # Seed legacy database
      - ./bin/seed-legacy.sh
      
      # Start Payload service with logging
      - echo "--- Starting Payload service..."
      - docker compose up -d payload
      - sleep 10
      - echo "--- Initial Payload logs"
      - docker compose logs payload --tail 30
      
      # Wait for payload healthcheck to pass (up to 5 minutes)
      - |
        echo "--- Waiting for Payload to be healthy..."
        for i in $$(seq 1 60); do
          # Check if container is still running
          CONTAINER_STATE=$$(docker compose ps payload --format json 2>/dev/null | grep -o '"State":"[^"]*"' | cut -d'"' -f4 || echo "unknown")
          if [ "$$CONTAINER_STATE" != "running" ]; then
            echo "❌ Payload container is not running (state: $$CONTAINER_STATE)"
            echo "=== Payload logs ==="
            docker compose logs payload --tail 200
            exit 1
          fi
          
          # Check health status
          STATUS=$$(docker compose ps payload --format json 2>/dev/null | grep -o '"Health":"[^"]*"' | cut -d'"' -f4 || echo "unknown")
          if [ "$$STATUS" = "healthy" ]; then
            echo "✅ Payload is healthy!"
            break
          fi
          
          # Also check via HTTP directly
          if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/admin 2>/dev/null | grep -q "200\|302"; then
            echo "✅ Payload is responding!"
            break
          fi
          
          if [ $$i -eq 60 ]; then
            echo "❌ Payload failed to become healthy after 5 minutes"
            echo "=== Payload logs ==="
            docker compose logs payload --tail 200
            exit 1
          fi
          
          # Every 10 iterations, show recent logs
          if [ $$((i % 10)) -eq 0 ]; then
            echo "--- Recent Payload logs:"
            docker compose logs payload --tail 10
          fi
          
          echo "   Waiting for Payload... ($$i/60, state: $$CONTAINER_STATE, health: $$STATUS)"
          sleep 5
        done
      
      # Run Playwright tests
      # Seed Payload database using the payload container (has network access to postgres)
      - echo "--- Seeding Payload database..."
      - docker compose exec -T payload yarn --ignore-engines seed:payload || echo "Seed failed, continuing..."
      
      # Debug: Check network and container status
      - echo "--- Debug Network and container info"
      - docker network ls
      - docker compose ps
      
      # Run Playwright - test network connectivity first
      - echo "--- Running Playwright E2E tests"
      - docker compose run --rm playwright bash -c "echo '=== DNS Check ===' && getent hosts payload || echo 'Cannot resolve payload' && getent hosts postgres || echo 'Cannot resolve postgres' && echo '=== Connectivity ===' && curl -s --connect-timeout 5 http://payload:3000/admin && echo 'Payload OK' || echo 'Cannot reach payload' && echo '=== Running Tests ===' && yarn install --frozen-lockfile && npx playwright test --reporter=list" || PLAYWRIGHT_EXIT=$$?
      
      # Show logs on failure
      - if [ "$${PLAYWRIGHT_EXIT:-0}" -ne 0 ]; then echo "=== Payload logs ===" && docker compose logs payload --tail 200 && exit $${PLAYWRIGHT_EXIT}; fi
      
      # Cleanup
      - docker compose down -v
    artifact_paths:
      - "playwright-report/**/*"
      - "test-results/**/*"
    agents:
      queue: "default"
      docker: "true"
