# Buildkite Pipeline for Y-Not Radio Site
# This pipeline replaces GitHub Actions CI workflow

env:
  NODE_VERSION: "22"
  PHP_VERSION: "7.4"
  CI: "true"

steps:
  # Fast feedback - Quality checks run in parallel
  - group: ":white_check_mark: Quality Checks"
    key: "quality"
    steps:
      - label: ":eslint: ESLint"
        key: "lint"
        command: |
          echo "--- :yarn: Installing dependencies"
          yarn install --frozen-lockfile
          
          echo "--- :eslint: Running ESLint"
          yarn lint
        plugins:
          - docker#v5.11.0:
              image: "node:22"
              volumes:
                - ".:/app"
              workdir: "/app"
              environment:
                - "CI=true"
        agents:
          queue: "default"

      - label: ":php: PHP_CodeSniffer"
        key: "php-lint"
        command: |
          cd src
          
          echo "--- :composer: Installing Composer dependencies"
          composer install --no-interaction --prefer-dist
          
          echo "--- :php: Running PHP_CodeSniffer"
          vendor/bin/phpcs --standard=phpcs.xml --warning-severity=0
        plugins:
          - docker#v5.11.0:
              image: "composer:2"
              volumes:
                - ".:/app"
              workdir: "/app"
        agents:
          queue: "default"

  # Test suite - Runs after quality checks
  - group: ":test_tube: Tests"
    key: "tests"
    depends_on: "quality"
    steps:
      - label: ":vitest: Unit Tests + Coverage"
        key: "test"
        command: |
          echo "--- :yarn: Installing dependencies"
          yarn install --frozen-lockfile
          
          echo "--- :vitest: Running tests with coverage"
          yarn test:coverage
          
          echo "--- :codecov: Uploading coverage to CodeCov"
          # Note: CODECOV_TOKEN is not available inside Docker containers
          # Codecov upload is skipped in containerized jobs
          echo "Skipping CodeCov upload (not available in containerized jobs)"
        artifact_paths:
          - "coverage/**/*"
        plugins:
          - docker#v5.11.0:
              image: "node:22"
              volumes:
                - ".:/app"
              workdir: "/app"
              environment:
                - "CI=true"
        agents:
          queue: "default"

      - label: ":storybook: Storybook Build"
        key: "storybook"
        command: |
          echo "--- :yarn: Installing dependencies"
          yarn install --frozen-lockfile
          
          echo "--- :storybook: Building Storybook"
          yarn build-storybook
        artifact_paths:
          - "storybook-static/**/*"
        plugins:
          - docker#v5.11.0:
              image: "node:22"
              volumes:
                - ".:/app"
              workdir: "/app"
              environment:
                - "CI=true"
        agents:
          queue: "default"

  # Next.js build - Runs after tests pass
  - label: ":nextjs: Next.js Build"
    key: "build"
    depends_on: "tests"
    command: |
      echo "--- :yarn: Installing dependencies"
      yarn install --frozen-lockfile
      
      echo "--- :nextjs: Building Next.js application"
      yarn build
    artifact_paths:
      - ".next/**/*"
    plugins:
      - docker#v5.11.0:
          image: "node:22"
          volumes:
            - ".:/app"
          workdir: "/app"
          environment:
            - "CI=true"
    agents:
      queue: "default"

  # E2E Tests - Runs after successful build
  # Strategy: Start services on host, run Playwright in container with host networking
  - label: ":playwright: E2E Tests"
    key: "e2e"
    depends_on: "build"
    timeout_in_minutes: 30
    env:
      CI: "true"
    commands:
      # Fetch secrets and login to GHCR (runs on host)
      - export GHCR_USERNAME=$$(buildkite-agent secret get GHCR_USERNAME)
      - export GHCR_TOKEN=$$(buildkite-agent secret get GHCR_TOKEN)
      - echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USERNAME" --password-stdin
      # Clean up any leftover containers/volumes from previous runs
      - docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v 2>/dev/null || true
      # Pull images on host
      - docker pull ghcr.io/ynotradio/site/phpfpm-dev:latest || echo "Could not pull phpfpm-dev, will build if needed"
      - docker pull ghcr.io/ynotradio/site/postgres-seeded:latest || echo "Could not pull postgres-seeded, will build if needed"
      - docker pull mysql:8.0 || true
      - docker pull httpd:2.4 || true
      - docker pull composer:2 || true
      # Install composer dependencies on host using Docker
      - docker run --rm -v "$$(pwd)/src:/app" -w /app composer:2 composer install --no-dev --optimize-autoloader
      # Setup E2E environment files on host using Node container
      - docker run --rm -v "$$(pwd):/app" -w /app node:22-slim ./bin/setup-e2e-env.sh
      # Start Docker services on host (so volume mounts work correctly)
      - docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d postgres mysql phpfpm apache
      # Wait for services (runs directly on host since it needs docker compose exec)
      - ./bin/wait-for-docker-services.sh
      # Initialize MySQL using Docker exec
      - docker compose exec -T mysql mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS ynotradio;"
      - docker compose exec -T mysql mysql -uroot -proot -e "CREATE USER IF NOT EXISTS 'ynotradio'@'%' IDENTIFIED BY 'ynotradio'; GRANT ALL PRIVILEGES ON ynotradio.* TO 'ynotradio'@'%'; FLUSH PRIVILEGES;"
      # Run yarn install in Node container
      - docker run --rm --network host -v "$$(pwd):/app" -w /app -e CI=true node:22-slim yarn install --frozen-lockfile
      # Seed database (runs on host since it uses docker compose exec)
      - ./bin/seed-legacy.sh
      # Start Payload dev server in background, run Playwright tests, cleanup
      - |
        docker run --rm \
          --network host \
          -v "$$(pwd):/app" \
          -w /app \
          -e CI=true \
          -e NODE_ENV=development \
          mcr.microsoft.com/playwright:v1.58.0-jammy \
          /bin/bash -c '
            set -e
            
            # Start Payload dev server in background using a wrapper
            echo "--- :payload: Starting Payload dev server..."
            
            # Create a PID file and log file
            touch /tmp/payload-dev.log
            
            # Start the server using sh -c to ensure proper backgrounding
            # This avoids issues with nohup and bash builtins
            (
              cd /app
              yarn --ignore-engines dev > /tmp/payload-dev.log 2>&1
              echo "Server exited at $(date)" >> /tmp/payload-dev.log
            ) &
            DEV_PID=$$!
            
            echo "Payload dev server started with PID $$DEV_PID"
            
            # Verify the log file was created
            if [ ! -f /tmp/payload-dev.log ]; then
              echo "ERROR: Log file was not created"
              exit 1
            fi
            
            # Wait for Payload to be ready (up to 3 minutes)
            echo "Waiting for Payload CMS to be ready..."
            i=0
            while [ $$i -lt 36 ]; do
              i=$$((i + 1))
              if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/admin 2>/dev/null | grep -q "200\|302"; then
                echo "✅ Payload CMS is ready!"
                break
              fi
              if [ $$i -eq 36 ]; then
                echo "❌ Payload CMS failed to start after 3 minutes"
                echo "=== Last 50 lines of Payload log ==="
                tail -50 /tmp/payload-dev.log || true
                kill $$DEV_PID 2>/dev/null || true
                exit 1
              fi
              echo "   Waiting for Payload... ($$i/36)"
              sleep 5
            done
            
            # Verify server is still running (wait longer to ensure stability)
            echo "Verifying Payload server is stable..."
            sleep 5
            if ! curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/admin 2>/dev/null | grep -q "200\|302"; then
              echo "❌ Payload server stopped unexpectedly after initial ready"
              echo "=== Server log ==="
              cat /tmp/payload-dev.log || true
              exit 1
            fi
            
            # Extra stability check - make sure it's still running after a few more seconds
            echo "Waiting 10 more seconds to ensure server is stable..."
            sleep 10
            if ! curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/admin 2>/dev/null | grep -q "200\|302"; then
              echo "❌ Payload server stopped during stability check"
              echo "=== Server log ==="
              cat /tmp/payload-dev.log || true
              exit 1
            fi
            echo "✅ Payload server is stable and ready for tests"
            
            # Keep monitoring server in background
            (
              while true; do
                sleep 5
                if ! ps -p $$DEV_PID > /dev/null 2>&1; then
                  echo "WARNING: Payload dev server (PID $$DEV_PID) has exited!"
                  break
                fi
              done
            ) &
            MONITOR_PID=$$!
            
            # Run Playwright tests
            echo "--- :playwright: Running Playwright E2E tests..."
            npx playwright test --reporter=list || TEST_EXIT_CODE=$$?
            
            # Show Payload logs if tests failed
            if [ "$${TEST_EXIT_CODE:-0}" -ne 0 ]; then
              echo "=== Payload dev server log ==="
              tail -100 /tmp/payload-dev.log || true
            fi
            
            # Stop monitoring and dev server
            echo "--- :stop_sign: Stopping Payload dev server..."
            kill $$MONITOR_PID 2>/dev/null || true
            kill $$DEV_PID 2>/dev/null || true
            
            # Exit with test result
            exit $${TEST_EXIT_CODE:-0}
          '
      # Cleanup
      - docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v 2>/dev/null || true
    artifact_paths:
      - "playwright-report/**/*"
      - "test-results/**/*"
    agents:
      queue: "default"
      docker: "true"
