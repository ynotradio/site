# Buildkite Pipeline for Y-Not Radio Site
#
# ITERATION MODE: Only E2E tests while debugging Playwright in Buildkite
# Other steps temporarily disabled for faster iteration.
#
# NOTE: Payload CMS tests are disabled due to cold start issues in DinD.
# Payload E2E tests run in GitHub Actions instead. Only Legacy PHP tests here.

env:
  CI: "true"

steps:
  # === E2E Integration Tests ===
  # Verifies Legacy PHP site works (Payload tests run in GitHub Actions)
  - label: ":playwright: E2E Tests (Legacy PHP)"
    key: "e2e"
    timeout_in_minutes: 10
    command: |
      cd e2e-buildkite
      
      # Login to GHCR to pull pre-built images
      echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USERNAME" --password-stdin
      
      # Pull images first (faster than waiting for compose to pull)
      echo "📦 Pulling pre-built images..."
      docker pull ghcr.io/ynotradio/site/phpfpm-dev:latest &
      docker pull ghcr.io/ynotradio/site/playwright:latest &
      wait
      
      # Start services (uses pre-built GHCR images by default)
      echo "🚀 Starting services..."
      docker compose up -d mysql apache phpfpm playwright
      
      # Wait for Playwright to run (it waits for depends_on services)
      echo "⏳ Running E2E tests..."
      docker compose logs -f playwright || {
        echo "🔍 All container logs on failure:"
        docker compose logs
        exit 1
      }
      
      # Get exit code
      EXIT_CODE=$$(docker compose ps playwright --format json | jq -r '.ExitCode // 0')
      
      # Cleanup
      docker compose down -v
      
      exit $$EXIT_CODE
    env:
      GHCR_USERNAME: "${GHCR_USERNAME}"
      GHCR_TOKEN: "${GHCR_TOKEN}"
    artifact_paths:
      - "e2e-buildkite/test-results/**/*"
      - "e2e-buildkite/playwright-report/**/*"
    agents:
      queue: "default"
      docker: "true"
