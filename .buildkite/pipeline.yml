# Buildkite Pipeline for Y-Not Radio Site — entry point
#
# This file is a lightweight gate that detects whether a PR contains any
# code-relevant changes. If it does, it dynamically uploads pipeline-ci.yml
# which contains all the actual CI steps. Doc-only PRs are skipped immediately
# to save build minutes.

steps:
  - label: ":mag: Check for code changes"
    key: "check-changes"
    command: "bash .buildkite/scripts/check-changes.sh"
    agents:
      queue: "default"
