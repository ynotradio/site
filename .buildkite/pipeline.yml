# Buildkite Pipeline for Y-Not Radio Site
# 
# ITERATION MODE: Only E2E tests while debugging Playwright in Buildkite
# Other steps (ESLint, Vitest, Storybook, PHP Lint) temporarily disabled

env:
  CI: "true"

steps:
  # Step 1: External site test (validates Playwright works)
  - label: ":playwright: E2E Tests (External Site)"
    key: "e2e-external"
    timeout_in_minutes: 5
    command: |
      cd e2e-buildkite && \
      npm install && \
      npx playwright test --reporter=list --grep="external"
    plugins:
      - docker#v5.11.0:
          image: "mcr.microsoft.com/playwright:v1.58.2-noble"
          propagate-environment: true
    artifact_paths:
      - "e2e-buildkite/test-results/**/*"
    agents:
      queue: "default"

  # Step 2: Payload CMS test (local services)
  - label: ":payload: E2E Tests (Payload CMS)"
    key: "e2e-payload"
    depends_on: "e2e-external"
    timeout_in_minutes: 15
    command: |
      echo "🚀 Starting Payload services..."
      cd e2e-buildkite
      
      # Start services
      docker compose up -d
      
      # Wait for postgres to be healthy
      echo "⏳ Waiting for postgres..."
      for i in {1..30}; do
        if docker compose exec -T postgres pg_isready -U ynot_postgres_user -d ynot_payload_dev 2>/dev/null; then
          echo "✅ Postgres ready"
          break
        fi
        sleep 2
      done
      
      # Wait for payload to be healthy, checking if it exits early
      echo "⏳ Waiting for Payload to be healthy (max 5 min)..."
      for i in {1..60}; do
        # Check if container still exists
        if ! docker ps -q -f name=e2e-buildkite-payload-1 | grep -q .; then
          echo "❌ Payload container stopped!"
          echo "=== PAYLOAD CONTAINER LOGS ==="
          docker compose logs payload 2>&1 | tail -200
          echo "=== END LOGS ==="
          docker compose down
          exit 1
        fi
        
        # Check health
        HEALTH=$$(docker inspect --format='{{.State.Health.Status}}' e2e-buildkite-payload-1 2>/dev/null || echo "none")
        echo "[$i/60] Payload health: $$HEALTH"
        
        if [ "$$HEALTH" = "healthy" ]; then
          echo "✅ Payload healthy!"
          break
        fi
        
        if [ $$i -eq 60 ]; then
          echo "⏰ Timeout waiting for Payload"
          echo "=== PAYLOAD CONTAINER LOGS ==="
          docker compose logs payload 2>&1 | tail -200
          echo "=== END LOGS ==="
          docker compose down
          exit 1
        fi
        
        sleep 5
      done
      
      # Verify connectivity
      echo "🔍 Testing connectivity..."
      curl -sf http://localhost:3000/admin/login > /dev/null && echo "✅ Payload reachable at localhost:3000" || {
        echo "⚠️ localhost:3000 not reachable via curl"
        docker compose logs payload | tail -50
      }
      
      echo "🧪 Running Playwright tests..."
      docker run --rm --network=host \
        -v "$$(pwd)/..:/app" -w /app/e2e-buildkite \
        -e CI=true \
        -e PAYLOAD_URL=http://localhost:3000 \
        mcr.microsoft.com/playwright:v1.58.2-noble \
        bash -c "npm install && npx playwright test --reporter=list --grep='local'"
      
      echo "🧹 Cleanup..."
      docker compose down
    artifact_paths:
      - "e2e-buildkite/test-results/**/*"
    agents:
      queue: "default"
