# Buildkite Pipeline for Y-Not Radio Site
# 
# ITERATION MODE: Only E2E tests while debugging Playwright in Buildkite
# Other steps (ESLint, Vitest, Storybook, PHP Lint) temporarily disabled

env:
  CI: "true"

steps:
  # E2E Tests - Using official Playwright Docker image
  # Following pattern from: https://github.com/buildkite/test-engine-client-examples
  - label: ":playwright: E2E Tests (External Site)"
    key: "e2e"
    timeout_in_minutes: 10
    command: |
      cd e2e-buildkite && \
      npm install && \
      npx playwright test --reporter=list
    plugins:
      - docker#v5.11.0:
          image: "mcr.microsoft.com/playwright:v1.48.1-noble"
          propagate-environment: true
    artifact_paths:
      - "e2e-buildkite/test-results/**/*"
    agents:
      queue: "default"

  # PHP Unit Tests
  - label: ":php: PHP Unit Tests"
    key: "php-test"
    command: |
      docker-php-ext-install mysqli && \
      cd src && \
      composer install --no-interaction --prefer-dist && \
      vendor/bin/phpunit --testdox
    plugins:
      - docker#v5.11.0:
          image: "composer:2"
          propagate-environment: true
    agents:
      queue: "default"
