# Buildkite Pipeline for Y-Not Radio Site
#
# E2E tests verifying Payload CMS → Legacy PHP site integration
# Unit tests temporarily skipped for faster iteration

env:
  CI: "true"

steps:
  # === E2E Integration Tests ===
  # Tests the full flow: Payload CMS creates data → Legacy PHP site displays it

  - label: ":playwright: E2E Integration Tests"
    key: "e2e-integration"
    timeout_in_minutes: 20
    command: |
      echo "🚀 Starting all services for E2E integration tests..."
      cd e2e-buildkite
      
      # Start all services: PostgreSQL, MySQL, Payload, PHP-FPM, Apache
      docker compose up -d postgres mysql payload phpfpm apache
      
      # Wait for PostgreSQL
      echo "⏳ Waiting for PostgreSQL..."
      for i in {1..30}; do
        if docker compose exec -T postgres pg_isready -U ynot_postgres_user -d ynot_payload_dev 2>/dev/null; then
          echo "✅ PostgreSQL ready"
          break
        fi
        sleep 2
      done
      
      # Wait for MySQL
      echo "⏳ Waiting for MySQL..."
      for i in {1..30}; do
        if docker compose exec -T mysql mysqladmin ping -h localhost -uroot -proot 2>/dev/null; then
          echo "✅ MySQL ready"
          break
        fi
        sleep 2
      done
      
      # Seed MySQL database with schema
      echo "🌱 Seeding MySQL database..."
      docker compose exec -T mysql bash -c 'MYSQL_PWD=root mysql -u root -e "CREATE DATABASE IF NOT EXISTS ynot_site;"'
      if [ -f "../src/db/docker/ynot_db.sql" ]; then
        docker compose exec -T mysql bash -c 'MYSQL_PWD=root mysql -u root ynot_site' < ../src/db/docker/ynot_db.sql
        echo "✅ MySQL schema imported"
      fi
      
      # Wait for Payload to be healthy
      echo "⏳ Waiting for Payload to be healthy..."
      for i in {1..90}; do
        if ! docker ps -q -f name=e2e-buildkite-payload-1 | grep -q .; then
          echo "❌ Payload container stopped!"
          docker compose logs payload 2>&1 | tail -100
          docker compose down
          exit 1
        fi
        
        HEALTH=$$(docker inspect --format='{{.State.Health.Status}}' e2e-buildkite-payload-1 2>/dev/null || echo "none")
        echo "[$i/90] Payload health: $$HEALTH"
        
        if [ "$$HEALTH" = "healthy" ]; then
          echo "✅ Payload healthy!"
          break
        fi
        
        if [ $$i -eq 90 ]; then
          echo "⏰ Timeout waiting for Payload"
          docker compose logs payload 2>&1 | tail -100
          docker compose down
          exit 1
        fi
        
        sleep 5
      done
      
      # Seed Payload database using the running Payload container
      echo "🌱 Seeding Payload database..."
      docker compose exec -T payload bash -c "yarn seed:payload" || {
        echo "⚠️ Seed failed or data already exists, continuing..."
      }
      echo "✅ Payload database ready"
      
      # Wait for PHP-FPM (composer install takes time)
      echo "⏳ Waiting for PHP-FPM..."
      for i in {1..60}; do
        if docker compose exec -T phpfpm php -v > /dev/null 2>&1; then
          echo "✅ PHP-FPM ready"
          break
        fi
        sleep 3
      done
      
      # Wait for Apache
      echo "⏳ Waiting for Apache..."
      for i in {1..30}; do
        if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
          echo "✅ Apache ready"
          break
        fi
        sleep 2
      done
      
      # Test connectivity via localhost (ports are published to host)
      echo "🔍 Testing service connectivity via localhost..."
      curl -sf http://localhost:3000/admin/login > /dev/null && echo "✅ Payload reachable at localhost:3000" || echo "❌ Payload unreachable"
      curl -sf http://localhost:8080/ > /dev/null && echo "✅ Apache reachable at localhost:8080" || echo "❌ Apache unreachable"
      
      echo "🧪 Running Playwright E2E tests..."
      # Use docker-compose network and service names as hostnames
      docker run --rm --network=e2e-buildkite_default \
        -v "$$(pwd)/..:/app" -w /app \
        -e CI=true \
        -e PLAYWRIGHT_BASE_URL=http://payload:3000 \
        -e PLAYWRIGHT_LEGACY_URL=http://apache:80 \
        -e SKIP_PAYLOAD_SEED=true \
        mcr.microsoft.com/playwright:v1.58.2-noble \
        bash -c "
          echo 'Testing connectivity via service names...'
          curl -sf http://payload:3000/admin/login > /dev/null && echo '✅ Payload reachable via payload:3000' || echo '❌ Payload unreachable'
          curl -sf http://apache:80/ > /dev/null && echo '✅ Apache reachable via apache:80' || echo '❌ Apache unreachable'
          
          npm install --legacy-peer-deps
          npx playwright test --reporter=list
        "
      
      echo "🧹 Cleanup..."
      docker compose down
    artifact_paths:
      - "e2e/screenshots/**/*"
      - "test-results/**/*"
      - "playwright-report/**/*"
    agents:
      queue: "default"
