# Buildkite Pipeline for Y-Not Radio Site
#
# CI pipeline with unit tests, linting, and E2E tests

env:
  NODE_VERSION: "22"
  PHP_VERSION: "7.4"
  CI: "true"

steps:
  # === Fast Unit Tests and Linting (run in parallel) ===
  
  # ESLint
  - label: ":eslint: ESLint"
    key: "eslint"
    command: "corepack enable && yarn install --immutable && yarn lint"
    plugins:
      - docker#v5.11.0:
          image: "node:22-slim"
          propagate-environment: true
    agents:
      queue: "default"

  # Vitest Unit Tests
  - label: ":test_tube: Vitest Tests"
    key: "vitest"
    command: "corepack enable && yarn install --immutable && yarn test:coverage"
    plugins:
      - docker#v5.11.0:
          image: "node:22-slim"
          propagate-environment: true
    artifact_paths:
      - "coverage/**/*"
    agents:
      queue: "default"

  # Storybook Build
  - label: ":storybook: Storybook Build"
    key: "storybook"
    command: "corepack enable && yarn install --immutable && yarn build-storybook"
    plugins:
      - docker#v5.11.0:
          image: "node:22-slim"
          propagate-environment: true
    artifact_paths:
      - "storybook-static/**/*"
    agents:
      queue: "default"

  # PHP Lint (CodeSniffer)
  - label: ":php: PHP Lint"
    key: "php-lint"
    command: |
      cd src && \
      composer install --no-interaction --prefer-dist && \
      vendor/bin/phpcs --standard=phpcs.xml --warning-severity=0
    plugins:
      - docker#v5.11.0:
          image: "composer:2"
          propagate-environment: true
    agents:
      queue: "default"

  # PHP Unit Tests
  - label: ":php: PHP Unit Tests"
    key: "php-test"
    command: |
      docker-php-ext-install mysqli && \
      cd src && \
      composer install --no-interaction --prefer-dist && \
      vendor/bin/phpunit --testdox
    plugins:
      - docker#v5.11.0:
          image: "composer:2"
          propagate-environment: true
    agents:
      queue: "default"

  # === E2E Tests (run after unit tests pass) ===

  # E2E: External site test (validates Playwright works)
  - label: ":playwright: E2E Tests (External Site)"
    key: "e2e-external"
    depends_on:
      - "eslint"
      - "vitest"
      - "storybook"
      - "php-lint"
      - "php-test"
    timeout_in_minutes: 5
    command: |
      cd e2e-buildkite && \
      npm install && \
      npx playwright test --reporter=list --grep="external"
    plugins:
      - docker#v5.11.0:
          image: "mcr.microsoft.com/playwright:v1.58.2-noble"
          propagate-environment: true
    artifact_paths:
      - "e2e-buildkite/test-results/**/*"
    agents:
      queue: "default"

  # E2E: Payload CMS test
  - label: ":payload: E2E Tests (Payload CMS)"
    key: "e2e-payload"
    depends_on: "e2e-external"
    timeout_in_minutes: 15
    command: |
      echo "🚀 Starting Payload services..."
      cd e2e-buildkite
      
      # Start only Payload-related services
      docker compose up -d postgres payload
      
      # Wait for postgres
      echo "⏳ Waiting for postgres..."
      for i in {1..30}; do
        if docker compose exec -T postgres pg_isready -U ynot_postgres_user -d ynot_payload_dev 2>/dev/null; then
          echo "✅ Postgres ready"
          break
        fi
        sleep 2
      done
      
      # Wait for payload
      echo "⏳ Waiting for Payload to be healthy..."
      for i in {1..60}; do
        if ! docker ps -q -f name=e2e-buildkite-payload-1 | grep -q .; then
          echo "❌ Payload container stopped!"
          docker compose logs payload 2>&1 | tail -100
          docker compose down
          exit 1
        fi
        
        HEALTH=$$(docker inspect --format='{{.State.Health.Status}}' e2e-buildkite-payload-1 2>/dev/null || echo "none")
        echo "[$i/60] Payload health: $$HEALTH"
        
        if [ "$$HEALTH" = "healthy" ]; then
          echo "✅ Payload healthy!"
          break
        fi
        
        if [ $$i -eq 60 ]; then
          echo "⏰ Timeout waiting for Payload"
          docker compose logs payload 2>&1 | tail -100
          docker compose down
          exit 1
        fi
        
        sleep 5
      done
      
      # Get Payload container IP
      PAYLOAD_IP=$$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' e2e-buildkite-payload-1)
      echo "📍 Payload IP: $$PAYLOAD_IP"
      
      echo "🧪 Running Payload tests..."
      docker run --rm --network=e2e-buildkite_default \
        --add-host=payload:$$PAYLOAD_IP \
        -v "$$(pwd)/..:/app" -w /app/e2e-buildkite \
        -e CI=true \
        -e PAYLOAD_URL=http://payload:3000 \
        mcr.microsoft.com/playwright:v1.58.2-noble \
        bash -c "
          echo 'Testing connectivity inside Playwright container...'
          curl -sf http://payload:3000/admin/login > /dev/null && echo '✅ curl payload:3000 works' || echo '❌ curl payload:3000 failed'
          echo 'Testing IP connectivity...'
          curl -sf http://$$PAYLOAD_IP:3000/admin/login > /dev/null && echo '✅ curl IP works' || echo '❌ curl IP failed'
          npm install && npx playwright test --reporter=list --grep='Payload'
        "
      
      echo "🧹 Cleanup..."
      docker compose down
    artifact_paths:
      - "e2e-buildkite/test-results/**/*"
    agents:
      queue: "default"

  # E2E: Legacy PHP site test
  - label: ":php: E2E Tests (Legacy PHP Site)"
    key: "e2e-legacy"
    depends_on: "e2e-payload"
    timeout_in_minutes: 15
    command: |
      echo "🚀 Starting Legacy PHP services..."
      cd e2e-buildkite
      
      # Start MySQL, PHP-FPM, and Apache
      docker compose up -d mysql phpfpm apache
      
      # Wait for MySQL
      echo "⏳ Waiting for MySQL..."
      for i in {1..30}; do
        if docker compose exec -T mysql mysqladmin ping -h localhost -uroot -proot 2>/dev/null; then
          echo "✅ MySQL ready"
          break
        fi
        sleep 2
      done
      
      # Seed MySQL database with schema and sample data
      echo "🌱 Seeding MySQL database..."
      # Create database
      docker compose exec -T mysql bash -c 'MYSQL_PWD=root mysql -u root -e "CREATE DATABASE IF NOT EXISTS ynot_site;"'
      
      # Import schema
      if [ -f "../src/db/docker/ynot_db.sql" ]; then
        docker compose exec -T mysql bash -c 'MYSQL_PWD=root mysql -u root ynot_site' < ../src/db/docker/ynot_db.sql
        echo "✅ Schema imported"
      else
        echo "⚠️ Schema file not found"
      fi
      
      # Seed minimal data
      docker compose exec -T mysql bash -c 'MYSQL_PWD=root mysql -u root ynot_site -e "
        INSERT IGNORE INTO stories (start_date, end_date, headline, story, pic, pic_url, priority, deleted) VALUES
        (\"2026-01-01\", \"2026-12-31\", \"Test Story\", \"Sample content\", \"\", \"\", 1, \"n\");
        INSERT IGNORE INTO deejays (id, name, \`show\`, email, external_connect_text, external_connect_url, pic, sort, deleted) VALUES
        (1, \"Test DJ\", \"Mondays\", \"test@test.com\", \"\", \"\", \"\", 1, \"no\");
      "'
      echo "✅ Sample data inserted"
      
      # Wait for PHP-FPM to be ready (composer install takes time)
      echo "⏳ Waiting for PHP-FPM..."
      for i in {1..60}; do
        if docker compose exec -T phpfpm php -v > /dev/null 2>&1; then
          echo "✅ PHP-FPM ready"
          break
        fi
        sleep 3
      done
      
      # Wait for Apache
      echo "⏳ Waiting for Apache..."
      for i in {1..30}; do
        if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
          echo "✅ Apache ready"
          break
        fi
        sleep 2
      done
      
      # Check Apache status
      if ! curl -sf http://localhost:8080/ > /dev/null 2>&1; then
        echo "⚠️ Apache not responding, checking logs..."
        docker compose logs apache 2>&1 | tail -50
        docker compose logs phpfpm 2>&1 | tail -50
      fi
      
      # Get Apache container IP
      APACHE_IP=$$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' e2e-buildkite-apache-1)
      echo "📍 Apache IP: $$APACHE_IP"
      
      echo "🧪 Running Legacy PHP tests..."
      docker run --rm --network=e2e-buildkite_default \
        --add-host=apache:$$APACHE_IP \
        -v "$$(pwd)/..:/app" -w /app/e2e-buildkite \
        -e CI=true \
        -e LEGACY_URL=http://apache:80 \
        mcr.microsoft.com/playwright:v1.58.2-noble \
        bash -c "
          echo 'Testing connectivity inside Playwright container...'
          curl -sf http://apache:80/ > /dev/null && echo '✅ curl apache:80 works' || echo '❌ curl apache:80 failed'
          npm install && npx playwright test --reporter=list --grep='Legacy'
        "
      
      echo "🧹 Cleanup..."
      docker compose down
    artifact_paths:
      - "e2e-buildkite/test-results/**/*"
    agents:
      queue: "default"
