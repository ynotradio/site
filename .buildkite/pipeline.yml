# Buildkite Pipeline for Y-Not Radio Site
# Uses docker-compose plugin for proper container networking

env:
  NODE_VERSION: "22"
  PHP_VERSION: "7.4"
  CI: "true"

steps:
  # E2E Tests - Using docker-compose plugin
  - label: ":playwright: E2E Tests"
    key: "e2e"
    timeout_in_minutes: 30
    plugins:
      # Run playwright service with all dependencies
      - docker-compose#v5.7.0:
          run: playwright
          config:
            - docker-compose.yml
            - docker-compose.ci.yml
            - docker-compose.e2e.yml
          env:
            - CI=true
            - NODE_ENV=development
            - SKIP_PAYLOAD_SEED=true
          # Mount checkout dir so playwright has access to code
          mount-checkout: true
          # Start dependent services (payload, postgres, mysql, apache, phpfpm)
          dependencies: true
          # Pull images 
          pull:
            - playwright
    artifact_paths:
      - "playwright-report/**/*"
      - "test-results/**/*"
    agents:
      queue: "default"
      docker: "true"
