# Buildkite Pipeline for Y-Not Radio Site
# This pipeline replaces GitHub Actions CI workflow

env:
  NODE_VERSION: "22"
  PHP_VERSION: "7.4"
  CI: "true"

steps:
  # Fast feedback - Quality checks run in parallel
  - group: ":white_check_mark: Quality Checks"
    key: "quality"
    steps:
      - label: ":eslint: ESLint"
        key: "lint"
        command: |
          echo "--- :yarn: Installing dependencies"
          yarn install --frozen-lockfile
          
          echo "--- :eslint: Running ESLint"
          yarn lint
        plugins:
          - docker#v5.11.0:
              image: "node:22"
              volumes:
                - ".:/app"
              workdir: "/app"
              environment:
                - "CI=true"
        agents:
          queue: "default"

      - label: ":php: PHP_CodeSniffer"
        key: "php-lint"
        command: |
          cd src
          
          echo "--- :composer: Installing Composer dependencies"
          composer install --no-interaction --prefer-dist
          
          echo "--- :php: Running PHP_CodeSniffer"
          vendor/bin/phpcs --standard=phpcs.xml --warning-severity=0
        plugins:
          - docker#v5.11.0:
              image: "composer:2"
              volumes:
                - ".:/app"
              workdir: "/app"
        agents:
          queue: "default"

  # Test suite - Runs after quality checks
  - group: ":test_tube: Tests"
    key: "tests"
    depends_on: "quality"
    steps:
      - label: ":vitest: Unit Tests + Coverage"
        key: "test"
        command: |
          echo "--- :yarn: Installing dependencies"
          yarn install --frozen-lockfile
          
          echo "--- :vitest: Running tests with coverage"
          yarn test:coverage
          
          echo "--- :codecov: Uploading coverage to CodeCov"
          # Note: CODECOV_TOKEN is not available inside Docker containers
          # Codecov upload is skipped in containerized jobs
          echo "Skipping CodeCov upload (not available in containerized jobs)"
        artifact_paths:
          - "coverage/**/*"
        plugins:
          - docker#v5.11.0:
              image: "node:22"
              volumes:
                - ".:/app"
              workdir: "/app"
              environment:
                - "CI=true"
        agents:
          queue: "default"

      - label: ":storybook: Storybook Build"
        key: "storybook"
        command: |
          echo "--- :yarn: Installing dependencies"
          yarn install --frozen-lockfile
          
          echo "--- :storybook: Building Storybook"
          yarn build-storybook
        artifact_paths:
          - "storybook-static/**/*"
        plugins:
          - docker#v5.11.0:
              image: "node:22"
              volumes:
                - ".:/app"
              workdir: "/app"
              environment:
                - "CI=true"
        agents:
          queue: "default"

  # Next.js build - Runs after tests pass
  - label: ":nextjs: Next.js Build"
    key: "build"
    depends_on: "tests"
    command: |
      echo "--- :yarn: Installing dependencies"
      yarn install --frozen-lockfile
      
      echo "--- :nextjs: Building Next.js application"
      yarn build
    artifact_paths:
      - ".next/**/*"
    plugins:
      - docker#v5.11.0:
          image: "node:22"
          volumes:
            - ".:/app"
          workdir: "/app"
          environment:
            - "CI=true"
    agents:
      queue: "default"

  # E2E Tests - Runs after successful build
  # Strategy: Run everything in Playwright container with Docker socket access
  - label: ":playwright: E2E Tests"
    key: "e2e"
    depends_on: "build"
    timeout_in_minutes: 30
    env:
      CI: "true"
    commands:
      # Fetch secrets and login to GHCR (runs on host)
      - export GHCR_USERNAME=$$(buildkite-agent secret get GHCR_USERNAME)
      - export GHCR_TOKEN=$$(buildkite-agent secret get GHCR_TOKEN)
      - echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USERNAME" --password-stdin
      # Pull images on host
      - docker pull ghcr.io/ynotradio/site/phpfpm-dev:latest || echo "Could not pull phpfpm-dev, will build if needed"
      - docker pull ghcr.io/ynotradio/site/postgres-seeded:latest || echo "Could not pull postgres-seeded, will build if needed"
      - docker pull mysql:8.0 || true
      - docker pull httpd:2.4 || true
      - docker pull composer:2 || true
      # Run all E2E setup and tests in Playwright container with Docker socket
      - |
        docker run --rm \
          --network host \
          -v "$$(pwd):/app" \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -w /app \
          -e CI=true \
          -e SKIP_DEPS_CHECK=false \
          mcr.microsoft.com/playwright:v1.50.1-jammy \
          /bin/bash -c '
            set -e
            echo "--- :yarn: Installing dependencies"
            yarn install --frozen-lockfile
            
            echo "--- :composer: Installing PHP dependencies"
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            cd src && composer install --no-dev --optimize-autoloader && cd ..
            
            echo "--- :gear: Setting up E2E test environment"
            ./bin/setup-e2e-env.sh
            
            echo "--- :docker: Starting Docker services"
            docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d postgres mysql phpfpm apache
            
            echo "--- :hourglass: Waiting for services..."
            ./bin/wait-for-docker-services.sh
            
            echo "--- :mysql: Initializing MySQL database"
            ./bin/init-mysql-db.sh
            
            echo "--- :seedling: Seeding databases"
            yarn seed:legacy
            
            echo "--- :playwright: Running Playwright E2E tests"
            npx playwright test
            
            echo "--- :broom: Cleaning up Docker containers"
            docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v 2>/dev/null || true
          '
    artifact_paths:
      - "playwright-report/**/*"
      - "test-results/**/*"
    agents:
      queue: "default"
      docker: "true"
