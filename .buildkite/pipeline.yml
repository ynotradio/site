# Buildkite Pipeline for Y-Not Radio Site
#
# E2E tests verifying Payload CMS → Legacy PHP site integration
# Unit tests temporarily skipped for faster iteration

env:
  CI: "true"

steps:
  # === E2E Integration Tests ===
  # Tests the full flow: Payload CMS creates data → Legacy PHP site displays it

  - label: ":playwright: E2E Integration Tests"
    key: "e2e-integration"
    timeout_in_minutes: 20
    command: |
      echo "🚀 Starting all services for E2E integration tests..."
      cd e2e-buildkite
      
      # Source environment variables
      if [ -f .env.example ]; then
        export $$(cat .env.example | grep -v '^#' | xargs)
      fi
      
      echo "📦 Using default images (pre-built images not yet available)"
      
      # Start all services: PostgreSQL, MySQL, Payload, PHP-FPM, Apache
      docker compose up -d postgres mysql payload phpfpm apache
      
      # Wait for PostgreSQL
      echo "⏳ Waiting for PostgreSQL..."
      for i in {1..30}; do
        if docker compose exec -T postgres pg_isready -U ynot_postgres_user -d ynot_payload_dev 2>/dev/null; then
          echo "✅ PostgreSQL ready"
          break
        fi
        sleep 2
      done
      
      # Wait for MySQL
      echo "⏳ Waiting for MySQL..."
      for i in {1..30}; do
        if docker compose exec -T mysql mysqladmin ping -h localhost -u$${MYSQL_USER:-ynot_sql_user} -p$${MYSQL_PASSWORD:-dev_mysql_password_not_secret} 2>/dev/null; then
          echo "✅ MySQL ready"
          break
        fi
        sleep 2
      done
      
      # Seed MySQL database with schema
      echo "🌱 Seeding MySQL database..."
      docker compose exec -T mysql bash -c "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD:-dev_root_password_not_secret} mysql -u root -e 'CREATE DATABASE IF NOT EXISTS $${MYSQL_DATABASE:-ynot_site};'"
      if [ -f "../src/db/docker/ynot_db.sql" ]; then
        docker compose exec -T mysql bash -c "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD:-dev_root_password_not_secret} mysql -u root $${MYSQL_DATABASE:-ynot_site}" < ../src/db/docker/ynot_db.sql
        echo "✅ MySQL schema imported"
      fi
      
      # Wait for all services to be healthy
      # PHP-FPM compiles extensions from source which takes 10+ minutes on first run
      echo "⏳ Waiting for services to be healthy (this may take 10-15 minutes on first run)..."
      for i in {1..180}; do
        PAYLOAD_HEALTH=$$(docker inspect --format='{{.State.Health.Status}}' e2e-buildkite-payload-1 2>/dev/null || echo "none")
        APACHE_HEALTH=$$(docker inspect --format='{{.State.Health.Status}}' e2e-buildkite-apache-1 2>/dev/null || echo "none")
        
        echo "[$$i/180] Payload: $$PAYLOAD_HEALTH, Apache: $$APACHE_HEALTH"
        
        if [ "$$PAYLOAD_HEALTH" = "healthy" ] && [ "$$APACHE_HEALTH" = "healthy" ]; then
          echo "✅ All services healthy!"
          break
        fi
        
        # Check for dead containers
        if ! docker ps -q -f name=e2e-buildkite-payload-1 | grep -q .; then
          echo "❌ Payload container stopped!"
          docker compose logs payload 2>&1 | tail -100
          docker compose down
          exit 1
        fi
        
        if [ $$i -eq 180 ]; then
          echo "⏰ Timeout waiting for services"
          docker compose logs 2>&1 | tail -200
          docker compose down
          exit 1
        fi
        
        sleep 5
      done
      
      echo "🧪 Running Playwright E2E tests via docker compose..."
      # Run Playwright as a docker-compose service (proper network integration)
      docker compose run --rm playwright
      TEST_EXIT_CODE=$$?
      
      echo "🧹 Cleanup..."
      docker compose down
      
      exit $$TEST_EXIT_CODE
    env:
      GHCR_USERNAME: "${GHCR_USERNAME}"
      GHCR_TOKEN: "${GHCR_TOKEN}"
    artifact_paths:
      - "e2e/screenshots/**/*"
      - "test-results/**/*"
      - "playwright-report/**/*"
    agents:
      queue: "default"
