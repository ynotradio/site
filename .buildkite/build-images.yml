# Buildkite Pipeline for Building Docker Images
# This pipeline replaces the GitHub Actions build-agent-images.yml workflow
# 
# Trigger: Automatically on main/master when Dockerfiles change (via pipeline.yml)
# Purpose: Build and push pre-built Docker images to GHCR for faster CI/agent testing
#
# Note: Payload image is NOT built here — it's always built locally in the E2E step
# because it needs fresh dependencies and the esbuild DinD workaround.

env:
  GHCR_REGISTRY: "ghcr.io"
  GHCR_ORG: "ynotradio/site"

steps:
  - group: ":docker: Build Docker Images"
    key: "build-images"
    steps:
      - label: ":php: Build PHP-FPM Dev Image"
        key: "build-phpfpm"
        command: |
          echo "--- :docker: Logging into GHCR"
          echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USERNAME" --password-stdin
          
          # Create short commit SHA (first 7 characters)
          SHORT_COMMIT=$${BUILDKITE_COMMIT:0:7}
          
          echo "--- :docker: Building PHP-FPM development image"
          docker build \
            -f bin/docker/phpfpm/Dockerfile \
            -t ghcr.io/$${GHCR_ORG}/phpfpm-dev:$$SHORT_COMMIT \
            -t ghcr.io/$${GHCR_ORG}/phpfpm-dev:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .
          
          echo "--- :docker: Pushing PHP-FPM image to GHCR"
          docker push ghcr.io/$${GHCR_ORG}/phpfpm-dev:$$SHORT_COMMIT
          docker push ghcr.io/$${GHCR_ORG}/phpfpm-dev:latest
        env:
          GHCR_USERNAME: "${GHCR_USERNAME}"
          GHCR_TOKEN: "${GHCR_TOKEN}"
        agents:
          queue: "default"
          docker: "true"

      - label: ":postgres: Build Postgres Seeded Image"
        key: "build-postgres"
        command: |
          echo "--- :docker: Logging into GHCR"
          echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USERNAME" --password-stdin
          
          # Create short commit SHA (first 7 characters)
          SHORT_COMMIT=$${BUILDKITE_COMMIT:0:7}
          
          echo "--- :docker: Building seeded Postgres image"
          docker build \
            -f bin/docker/postgres/Dockerfile \
            -t ghcr.io/$${GHCR_ORG}/postgres-seeded:$$SHORT_COMMIT \
            -t ghcr.io/$${GHCR_ORG}/postgres-seeded:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .
          
          echo "--- :docker: Pushing Postgres image to GHCR"
          docker push ghcr.io/$${GHCR_ORG}/postgres-seeded:$$SHORT_COMMIT
          docker push ghcr.io/$${GHCR_ORG}/postgres-seeded:latest
        env:
          GHCR_USERNAME: "${GHCR_USERNAME}"
          GHCR_TOKEN: "${GHCR_TOKEN}"
        agents:
          queue: "default"
          docker: "true"

      - label: ":playwright: Build Playwright Image"
        key: "build-playwright"
        command: |
          echo "--- :docker: Logging into GHCR"
          echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USERNAME" --password-stdin
          
          # Create short commit SHA (first 7 characters)
          SHORT_COMMIT=$${BUILDKITE_COMMIT:0:7}
          
          echo "--- :docker: Building Playwright image with pre-installed deps"
          docker build \
            -f Dockerfile.playwright \
            -t ghcr.io/$${GHCR_ORG}/playwright:$$SHORT_COMMIT \
            -t ghcr.io/$${GHCR_ORG}/playwright:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .
          
          echo "--- :docker: Pushing Playwright image to GHCR"
          docker push ghcr.io/$${GHCR_ORG}/playwright:$$SHORT_COMMIT
          docker push ghcr.io/$${GHCR_ORG}/playwright:latest
        env:
          GHCR_USERNAME: "${GHCR_USERNAME}"
          GHCR_TOKEN: "${GHCR_TOKEN}"
        agents:
          queue: "default"
          docker: "true"
