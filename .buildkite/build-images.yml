# Buildkite Pipeline for Building Docker Images
# This pipeline replaces the GitHub Actions build-agent-images.yml workflow
# 
# Trigger: Manual or on push to main/master when relevant files change
# Purpose: Build and push pre-built Docker images to GHCR for faster CI/agent testing

env:
  GHCR_REGISTRY: "ghcr.io"
  GHCR_ORG: "ynotradio/site"

steps:
  - group: ":docker: Build Docker Images"
    key: "build-images"
    steps:
      - label: ":package: Build Payload Dev Image"
        key: "build-payload"
        branches: "main master"
        command: |
          echo "--- :docker: Logging into GHCR"
          echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USERNAME" --password-stdin
          
          echo "--- :docker: Building Payload development image"
          docker build \
            -f Dockerfile.payload \
            -t ghcr.io/$${GHCR_ORG}/payload-dev:$${BUILDKITE_COMMIT:0:7} \
            -t ghcr.io/$${GHCR_ORG}/payload-dev:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .
          
          echo "--- :docker: Pushing Payload image to GHCR"
          docker push ghcr.io/$${GHCR_ORG}/payload-dev:$${BUILDKITE_COMMIT:0:7}
          docker push ghcr.io/$${GHCR_ORG}/payload-dev:latest
        env:
          GHCR_USERNAME: "${GHCR_USERNAME}"
          GHCR_TOKEN: "${GHCR_TOKEN}"
        agents:
          queue: "default"
          docker: "true"

      - label: ":php: Build PHP-FPM Dev Image"
        key: "build-phpfpm"
        branches: "main master"
        command: |
          echo "--- :docker: Logging into GHCR"
          echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USERNAME" --password-stdin
          
          echo "--- :docker: Building PHP-FPM development image"
          docker build \
            -f bin/docker/phpfpm/Dockerfile \
            -t ghcr.io/$${GHCR_ORG}/phpfpm-dev:$${BUILDKITE_COMMIT:0:7} \
            -t ghcr.io/$${GHCR_ORG}/phpfpm-dev:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .
          
          echo "--- :docker: Pushing PHP-FPM image to GHCR"
          docker push ghcr.io/$${GHCR_ORG}/phpfpm-dev:$${BUILDKITE_COMMIT:0:7}
          docker push ghcr.io/$${GHCR_ORG}/phpfpm-dev:latest
        env:
          GHCR_USERNAME: "${GHCR_USERNAME}"
          GHCR_TOKEN: "${GHCR_TOKEN}"
        agents:
          queue: "default"
          docker: "true"

      - label: ":postgres: Build Postgres Seeded Image"
        key: "build-postgres"
        branches: "main master"
        command: |
          echo "--- :docker: Logging into GHCR"
          echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USERNAME" --password-stdin
          
          echo "--- :docker: Building seeded Postgres image"
          docker build \
            -f bin/docker/postgres/Dockerfile \
            -t ghcr.io/$${GHCR_ORG}/postgres-seeded:$${BUILDKITE_COMMIT:0:7} \
            -t ghcr.io/$${GHCR_ORG}/postgres-seeded:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .
          
          echo "--- :docker: Pushing Postgres image to GHCR"
          docker push ghcr.io/$${GHCR_ORG}/postgres-seeded:$${BUILDKITE_COMMIT:0:7}
          docker push ghcr.io/$${GHCR_ORG}/postgres-seeded:latest
        env:
          GHCR_USERNAME: "${GHCR_USERNAME}"
          GHCR_TOKEN: "${GHCR_TOKEN}"
        agents:
          queue: "default"
          docker: "true"
