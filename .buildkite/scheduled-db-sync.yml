# Buildkite Pipeline for Scheduled Database Sync
# This pipeline resets the Neon development branch from production.
#
# Schedule: Weekly on Monday at 2:00 AM UTC
# Purpose: Sync production database to development for testing
#
# Note: The nightly pipeline also resets dev from prod after each import.
# This weekly pipeline serves as a safety net in case the nightly run
# is skipped or fails before reaching the reset step.
#
# Configure as a scheduled build in Buildkite UI:
# Schedule: 0 2 * * 1 (cron format: Monday at 2 AM UTC)
# Branch: master

env:
  NODE_VERSION: "24"
  NEON_PROJECT_ID: "flat-bird-55654203"
  NEON_ORG_ID: "org-cool-hat-59377226"

steps:
  - label: ":neon: Sync Production → Development"
    key: "db-sync"
    timeout_in_minutes: 5
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 255
          limit: 1
    command: |
      echo "--- :neon: Resetting development branch to match production"
      npx neonctl branches reset development \
        --parent \
        --api-key "$$NEON_API_KEY" \
        --project-id "$$NEON_PROJECT_ID" \
        --org-id "$$NEON_ORG_ID"
      echo "✅ Development branch reset to production"
    plugins:
      - docker#v5.11.0:
          image: "node:24-slim"
          propagate-environment: true
          environment:
            - "NEON_API_KEY"
            - "NEON_PROJECT_ID"
            - "NEON_ORG_ID"
    agents:
      queue: "default"

  - wait: ~
    continue_on_failure: true

  - label: ":memo: Annotate on Failure"
    command: |
      buildkite-agent annotate \
        "⚠️ Database sync failed. Check the logs above for details." \
        --style "warning" \
        --context "db-sync-failure"
    if: build.state == "failed"
    agents:
      queue: "default"
