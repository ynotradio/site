# Buildkite Pipeline for Scheduled Database Sync
# This pipeline refreshes the preview database from production.
#
# Schedule: Weekly on Monday at 2:00 AM UTC
# Purpose: Sync production database to preview for testing
#
# Note: The nightly pipeline also refreshes preview from production after each import.
# This weekly pipeline serves as a safety net in case the nightly run
# is skipped or fails before reaching the refresh step.
#
# Configure as a scheduled build in Buildkite UI:
# Schedule: 0 2 * * 1 (cron format: Monday at 2 AM UTC)
# Branch: master

steps:
  - label: ":database: Sync Production → Preview"
    key: "db-sync"
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 255
          limit: 1
    command: |
      bash .buildkite/scripts/refresh-preview-database.sh
    plugins:
      - docker#v5.11.0:
          image: "postgres:16"
          propagate-environment: true
          environment:
            - "PRODUCTION_DATABASE_URL"
            - "PREVIEW_DATABASE_URL"
    agents:
      queue: "default"

  - wait: ~
    continue_on_failure: true

  - label: ":memo: Annotate on Failure"
    command: |
      buildkite-agent annotate \
        "⚠️ Database sync failed. Check the logs above for details." \
        --style "warning" \
        --context "db-sync-failure"
    if: build.state == "failed"
    agents:
      queue: "default"
