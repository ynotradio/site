# PR-to-Production Deploy Pipeline
#
# Triggered via the Buildkite REST API by the GitHub Actions workflow
# .github/workflows/deploy-pr-on-label.yml when a PR is labeled
# `deploy-to-prod`. The workflow passes the PR's head SHA so this pipeline
# deploys exactly that commit — no CI gate, no branch filter.
#
# Configure the Buildkite pipeline (e.g. y-not-radio-deploy-pr) to read
# its steps from this file. Reuses deploy-legacy.sh so the deploy logic
# stays in one place.
#
# Required Buildkite secrets (same as pipeline-deploy-legacy.yml):
#   DEPLOY_SSH_KEY, DEPLOY_SSH_HOST, DEPLOY_SSH_KNOWN_HOSTS, ENV_PHP_CONTENTS

steps:
  - label: ":rocket: Deploy PR to Production"
    key: "deploy-pr"
    command: "bash .buildkite/scripts/deploy-legacy.sh"
    plugins:
      - docker#v5.11.0:
          image: "composer:2"
          propagate-environment: true
          # Secrets are fetched in .buildkite/hooks/pre-command (on the agent
          # host, where the Job API socket is available) and exported as env
          # vars. propagate-environment only forwards BUILDKITE_*; list the
          # custom vars explicitly so the docker plugin passes them through.
          environment:
            - "DEPLOY_SSH_KEY"
            - "DEPLOY_SSH_HOST"
            - "DEPLOY_SSH_KNOWN_HOSTS"
            - "ENV_PHP_CONTENTS"
    agents:
      queue: "default"

  - label: ":email: Notify deploy"
    key: "notify-deploy"
    depends_on: "deploy-pr"
    # Never fail the build on notification errors
    soft_fail: true
    command: "bash .buildkite/scripts/notify-deploy.sh"
    plugins:
      - docker#v5.11.0:
          image: "node:22-slim"
          propagate-environment: true
          environment:
            - "RESEND_API_KEY"
            - "DEPLOY_NOTIFY_EMAIL"
            - "GITHUB_PR_TOKEN"
            - "DEPLOY_PR_NUMBER"
    agents:
      queue: "default"
