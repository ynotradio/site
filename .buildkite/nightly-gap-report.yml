# Buildkite Pipeline for Nightly Import & Gap Report
#
# 1. Runs incremental import (prod MySQL → production database) to import new records
# 2. Posts an import summary as a comment on the tracking GitHub issue
# 3. Refreshes the preview database from a production snapshot using pg_dump/psql
# 4. Generates a gap report comparing MySQL vs preview database
# 5. Updates the GitHub issue body with the gap report
# 6. Runs integrity checks against the preview database
#
# Note: Configure this as a scheduled build in Buildkite UI:
# Schedule: 0 3 * * * (cron format: daily at 3 AM UTC)
# Branch: master
#
# Required Buildkite secrets (set via Buildkite UI → Pipeline → Secrets):
#   PROD_MYSQL_HOST        — Production MySQL hostname
#   PROD_MYSQL_USER        — Production MySQL username
#   PROD_MYSQL_PASSWORD    — Production MySQL password
#   PROD_MYSQL_DATABASE    — Production MySQL database name (default: ynot_site)
#   PRODUCTION_DATABASE_URL — Production PostgreSQL connection string (import target)
#   PREVIEW_DATABASE_URL    — Preview PostgreSQL connection string (used by gap report & integrity checks)
#   GITHUB_PR_TOKEN              — Fine-grained PAT with issues:write permission
#   GAP_REPORT_ISSUE_NUMBER      — GitHub issue number to update with results
#   INTEGRITY_REPORT_ISSUE_NUMBER — GitHub issue number for integrity report

env:
  NODE_VERSION: "22"

steps:
  - label: ":package: Incremental Import"
    key: "import"
    timeout_in_minutes: 30
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 255
          limit: 1
    command: |
      echo "--- :yarn: Installing dependencies"
      corepack enable && yarn install --immutable

      echo "--- :package: Running incremental import (prod-mysql → production-db)"
      node --import ./bin/preload-nextenv-fix.mjs --import tsx bin/incremental-import.ts \
        --from prod-mysql \
        --to production-db \
        --reset \
        --output /tmp/import-summary.md \
        --verbose

      echo "--- :speech_balloon: Posting import summary comment"
      if [ -f /tmp/import-summary.md ]; then
        node .buildkite/scripts/post-import-summary-comment.mjs /tmp/import-summary.md || true
      else
        echo "⚠️ No import summary file found, skipping comment"
      fi
    plugins:
      - docker#v5.11.0:
          image: "node:22-slim"
          propagate-environment: true
          environment:
            - "PROD_MYSQL_HOST"
            - "PROD_MYSQL_USER"
            - "PROD_MYSQL_PASSWORD"
            - "PROD_MYSQL_DATABASE"
            - "PRODUCTION_DATABASE_URL"
            - "GITHUB_PR_TOKEN"
            - "GAP_REPORT_ISSUE_NUMBER"
    agents:
      queue: "default"

  - label: ":database: Refresh preview database"
    key: "refresh-preview-db"
    depends_on: "import"
    timeout_in_minutes: 15
    command: |
      bash .buildkite/scripts/refresh-preview-database.sh
    plugins:
      - docker#v5.11.0:
          image: "postgres:16"
          propagate-environment: true
          environment:
            - "PRODUCTION_DATABASE_URL"
            - "PREVIEW_DATABASE_URL"
    agents:
      queue: "default"

  - label: ":bar_chart: Gap Report"
    key: "gap-report"
    depends_on: "refresh-preview-db"
    timeout_in_minutes: 15
    command: |
      echo "--- :yarn: Installing dependencies"
      corepack enable && yarn install --immutable

      echo "--- :bar_chart: Running gap report (prod-mysql vs preview-db)"
      node --import ./bin/preload-nextenv-fix.mjs --import tsx bin/migrations/importGapReport.ts \
        --from prod-mysql \
        --to preview-db \
        --output /tmp/gap-report.md \
        --verbose

      echo "--- :github: Updating GitHub issue #$$GAP_REPORT_ISSUE_NUMBER"
      node .buildkite/scripts/update-gap-report-issue.mjs /tmp/gap-report.md
    plugins:
      - docker#v5.11.0:
          image: "node:22-slim"
          propagate-environment: true
          environment:
            - "PROD_MYSQL_HOST"
            - "PROD_MYSQL_USER"
            - "PROD_MYSQL_PASSWORD"
            - "PROD_MYSQL_DATABASE"
            - "PREVIEW_DATABASE_URL"
            - "GITHUB_PR_TOKEN"
            - "GAP_REPORT_ISSUE_NUMBER"
    agents:
      queue: "default"

  # --- Parallel integrity checks (each runs independently for speed) ---
  - group: ":stethoscope: Content Integrity Checks"
    key: "integrity-checks"
    depends_on: "refresh-preview-db"
    allow_dependency_failure: true
    steps:
      - label: ":bust_in_silhouette: Check display names"
        key: "check-display-names"
        timeout_in_minutes: 15
        command: "bash .buildkite/scripts/run-single-integrity-check.sh display-names"
        artifact_paths: ["integrity-display-names.md"]
        soft_fail: true
        plugins:
          - docker#v5.11.0:
              image: "node:22-slim"
              propagate-environment: true
              environment:
                - "PREVIEW_DATABASE_URL"
        agents:
          queue: "default"

      - label: ":link: Check slugs"
        key: "check-slugs"
        timeout_in_minutes: 15
        command: "bash .buildkite/scripts/run-single-integrity-check.sh slugs"
        artifact_paths: ["integrity-slugs.md"]
        soft_fail: true
        plugins:
          - docker#v5.11.0:
              image: "node:22-slim"
              propagate-environment: true
              environment:
                - "PREVIEW_DATABASE_URL"
        agents:
          queue: "default"

      - label: ":musical_note: Check MusicBrainz"
        key: "check-musicbrainz"
        timeout_in_minutes: 15
        command: "bash .buildkite/scripts/run-single-integrity-check.sh musicbrainz"
        artifact_paths: ["integrity-musicbrainz.md"]
        soft_fail: true
        plugins:
          - docker#v5.11.0:
              image: "node:22-slim"
              propagate-environment: true
              environment:
                - "PREVIEW_DATABASE_URL"
        agents:
          queue: "default"

      - label: ":cd: Check record metadata"
        key: "check-record-metadata"
        timeout_in_minutes: 15
        command: "bash .buildkite/scripts/run-single-integrity-check.sh record-metadata"
        artifact_paths: ["integrity-record-metadata.md"]
        soft_fail: true
        plugins:
          - docker#v5.11.0:
              image: "node:22-slim"
              propagate-environment: true
              environment:
                - "PREVIEW_DATABASE_URL"
        agents:
          queue: "default"

      - label: ":radio: Check OnDemand sources"
        key: "check-ondemand-source"
        timeout_in_minutes: 15
        command: "bash .buildkite/scripts/run-single-integrity-check.sh ondemand-source"
        artifact_paths: ["integrity-ondemand-source.md"]
        soft_fail: true
        plugins:
          - docker#v5.11.0:
              image: "node:22-slim"
              propagate-environment: true
              environment:
                - "PREVIEW_DATABASE_URL"
                - "PROD_MYSQL_HOST"
                - "PROD_MYSQL_USER"
                - "PROD_MYSQL_PASSWORD"
                - "PROD_MYSQL_DATABASE"
        agents:
          queue: "default"

      - label: ":white_check_mark: Check publish status"
        key: "check-publish-status"
        timeout_in_minutes: 15
        command: "bash .buildkite/scripts/run-single-integrity-check.sh publish-status"
        artifact_paths: ["integrity-publish-status.md"]
        soft_fail: true
        plugins:
          - docker#v5.11.0:
              image: "node:22-slim"
              propagate-environment: true
              environment:
                - "PREVIEW_DATABASE_URL"
                - "PROD_MYSQL_HOST"
                - "PROD_MYSQL_USER"
                - "PROD_MYSQL_PASSWORD"
                - "PROD_MYSQL_DATABASE"
        agents:
          queue: "default"

      - label: ":microphone: Check DJ data quality"
        key: "check-djs"
        timeout_in_minutes: 15
        command: "bash .buildkite/scripts/run-single-integrity-check.sh djs"
        artifact_paths: ["integrity-djs.md"]
        soft_fail: true
        plugins:
          - docker#v5.11.0:
              image: "node:22-slim"
              propagate-environment: true
              environment:
                - "PREVIEW_DATABASE_URL"
        agents:
          queue: "default"

  - label: ":bar_chart: Combine & Post Integrity Report"
    key: "combine-integrity-report"
    depends_on: "integrity-checks"
    allow_dependency_failure: true
    timeout_in_minutes: 5
    command: "bash .buildkite/scripts/combine-integrity-reports.sh"
    plugins:
      - docker#v5.11.0:
          image: "node:22-slim"
          propagate-environment: true
          environment:
            - "GITHUB_PR_TOKEN"
            - "INTEGRITY_REPORT_ISSUE_NUMBER"
    agents:
      queue: "default"

  - wait: ~
    continue_on_failure: true

  - label: ":memo: Annotate on Failure"
    command: |
      buildkite-agent annotate \
        "⚠️ Nightly import/gap report failed. Check logs for details." \
        --style "warning" \
        --context "gap-report-failure"
    if: build.state == "failed"
    agents:
      queue: "default"
