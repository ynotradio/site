# Buildkite Pipeline for Nightly Import & Gap Report
#
# 1. Runs incremental import (prod MySQL → prod Neon) to import new records
# 2. Posts an import summary as a comment on the tracking GitHub issue
# 3. Generates a gap report comparing MySQL vs Neon
# 4. Updates the GitHub issue body with the gap report
#
# Note: Configure this as a scheduled build in Buildkite UI:
# Schedule: 0 3 * * * (cron format: daily at 3 AM UTC)
# Branch: master
#
# Required Buildkite secrets (set via Buildkite UI → Pipeline → Secrets):
#   PROD_MYSQL_HOST        — Production MySQL hostname
#   PROD_MYSQL_USER        — Production MySQL username
#   PROD_MYSQL_PASSWORD    — Production MySQL password
#   PROD_MYSQL_DATABASE    — Production MySQL database name (default: ynot_site)
#   NEON_PROD_DATABASE_URL — Production Neon/PostgreSQL connection string
#   GITHUB_PR_TOKEN              — Fine-grained PAT with issues:write permission
#   GAP_REPORT_ISSUE_NUMBER      — GitHub issue number to update with results
#   INTEGRITY_REPORT_ISSUE_NUMBER — GitHub issue number for integrity report

env:
  NODE_VERSION: "22"

steps:
  - label: ":package: Import & :bar_chart: Gap Report"
    key: "import-and-gap-report"
    timeout_in_minutes: 30
    command: |
      echo "--- :yarn: Installing dependencies"
      corepack enable && yarn install --immutable

      echo "--- :package: Running incremental import (prod-mysql → prod-neon)"
      IMPORT_FAILED=""
      node --import ./bin/preload-nextenv-fix.mjs --import tsx bin/incremental-import.ts \
        --from prod-mysql \
        --to prod-neon \
        --reset \
        --output /tmp/import-summary.md \
        --verbose || IMPORT_FAILED=1

      echo "--- :speech_balloon: Posting import summary comment"
      if [ -f /tmp/import-summary.md ]; then
        node .buildkite/scripts/post-import-summary-comment.mjs /tmp/import-summary.md || true
      else
        echo "⚠️ No import summary file found, skipping comment"
      fi

      echo "--- :bar_chart: Running gap report (prod-mysql → prod-neon)"
      node --import ./bin/preload-nextenv-fix.mjs --import tsx bin/migrations/importGapReport.ts \
        --from prod-mysql \
        --to prod-neon \
        --output /tmp/gap-report.md \
        --verbose

      echo "--- :github: Updating GitHub issue #$$GAP_REPORT_ISSUE_NUMBER"
      node .buildkite/scripts/update-gap-report-issue.mjs /tmp/gap-report.md

      if [ "$IMPORT_FAILED" = "1" ]; then
        echo "⚠️ Import step failed (see above), but gap report was updated."
        exit 1
      fi
    plugins:
      - docker#v5.11.0:
          image: "node:22-slim"
          propagate-environment: true
          environment:
            - "PROD_MYSQL_HOST"
            - "PROD_MYSQL_USER"
            - "PROD_MYSQL_PASSWORD"
            - "PROD_MYSQL_DATABASE"
            - "NEON_PROD_DATABASE_URL"
            - "GITHUB_PR_TOKEN"
            - "GAP_REPORT_ISSUE_NUMBER"
    agents:
      queue: "default"

  - label: ":stethoscope: Content Integrity Checks"
    key: "integrity-checks"
    depends_on: "import-and-gap-report"
    allow_dependency_failure: true
    timeout_in_minutes: 45
    command: |
      echo "--- :yarn: Installing dependencies"
      corepack enable && yarn install --immutable

      export DATABASE_URI="$$NEON_PROD_DATABASE_URL"

      echo "--- :bust_in_silhouette: Checking display names"
      node --import ./bin/preload-nextenv-fix.mjs --import tsx \
        bin/integrity-check-display-names.ts \
        --output /tmp/integrity-display-names.md \
        --verbose || true

      echo "--- :link: Checking slugs"
      node --import ./bin/preload-nextenv-fix.mjs --import tsx \
        bin/integrity-check-slugs.ts \
        --output /tmp/integrity-slugs.md \
        --verbose || true

      echo "--- :musical_note: Checking MusicBrainz associations"
      node --import ./bin/preload-nextenv-fix.mjs --import tsx \
        bin/integrity-check-musicbrainz.ts \
        --skip-type-check \
        --output /tmp/integrity-musicbrainz.md \
        --verbose || true

      echo "--- :cd: Checking record metadata"
      node --import ./bin/preload-nextenv-fix.mjs --import tsx \
        bin/integrity-check-record-metadata.ts \
        --output /tmp/integrity-record-metadata.md \
        --verbose || true

      echo "--- :radio: Checking OnDemand source fields"
      node --import ./bin/preload-nextenv-fix.mjs --import tsx \
        bin/integrity-check-ondemand-source.ts \
        --from prod-mysql \
        --output /tmp/integrity-ondemand-source.md \
        --verbose || true

      echo "--- :white_check_mark: Checking publish status"
      node --import ./bin/preload-nextenv-fix.mjs --import tsx \
        bin/integrity-check-publish-status.ts \
        --from prod-mysql \
        --output /tmp/integrity-publish-status.md \
        --verbose || true

      echo "--- :bar_chart: Combining reports"
      {
        echo "# Nightly Content Integrity Report"
        echo ""
        echo "_Generated by Buildkite build #$${BUILDKITE_BUILD_NUMBER}_"
        echo ""
        for report in /tmp/integrity-display-names.md /tmp/integrity-slugs.md /tmp/integrity-musicbrainz.md /tmp/integrity-record-metadata.md; do
          if [ -f "$$report" ]; then
            echo ""
            cat "$$report"
            echo ""
            echo "---"
          fi
        done
      } > /tmp/integrity-combined-report.md

      echo "--- :github: Posting integrity report"
      if [ -n "$$INTEGRITY_REPORT_ISSUE_NUMBER" ]; then
        node .buildkite/scripts/update-integrity-report-issue.mjs /tmp/integrity-combined-report.md
      else
        echo "⚠️ INTEGRITY_REPORT_ISSUE_NUMBER not set, skipping GitHub issue update"
        cat /tmp/integrity-combined-report.md
      fi
    plugins:
      - docker#v5.11.0:
          image: "node:22-slim"
          propagate-environment: true
          environment:
            - "NEON_PROD_DATABASE_URL"
            - "PROD_MYSQL_HOST"
            - "PROD_MYSQL_USER"
            - "PROD_MYSQL_PASSWORD"
            - "PROD_MYSQL_DATABASE"
            - "GITHUB_PR_TOKEN"
            - "INTEGRITY_REPORT_ISSUE_NUMBER"
    agents:
      queue: "default"

  - wait: ~
    continue_on_failure: true

  - label: ":memo: Annotate on Failure"
    command: |
      buildkite-agent annotate \
        "⚠️ Nightly import/gap report failed. Check logs for details." \
        --style "warning" \
        --context "gap-report-failure"
    if: build.state == "failed"
    agents:
      queue: "default"
