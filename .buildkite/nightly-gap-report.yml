# Buildkite Pipeline for Nightly Import & Gap Report
#
# 1. Runs incremental import (prod MySQL → prod Neon) to import new records
# 2. Posts an import summary as a comment on the tracking GitHub issue
# 3. Resets the Neon development branch from production
# 4. Generates a gap report comparing MySQL vs dev Neon (post-reset snapshot of prod)
# 5. Updates the GitHub issue body with the gap report
# 6. Runs integrity checks against the dev Neon branch
#
# Note: Configure this as a scheduled build in Buildkite UI:
# Schedule: 0 3 * * * (cron format: daily at 3 AM UTC)
# Branch: master
#
# Required Buildkite secrets (set via Buildkite UI → Pipeline → Secrets):
#   PROD_MYSQL_HOST        — Production MySQL hostname
#   PROD_MYSQL_USER        — Production MySQL username
#   PROD_MYSQL_PASSWORD    — Production MySQL password
#   PROD_MYSQL_DATABASE    — Production MySQL database name (default: ynot_site)
#   NEON_PROD_DATABASE_URL — Production Neon/PostgreSQL connection string (import target)
#   NEON_DEV_DATABASE_URL  — Development Neon branch (used by gap report & integrity checks post-reset)
#   GITHUB_PR_TOKEN              — Fine-grained PAT with issues:write permission
#   GAP_REPORT_ISSUE_NUMBER      — GitHub issue number to update with results
#   INTEGRITY_REPORT_ISSUE_NUMBER — GitHub issue number for integrity report
#   NEON_API_KEY                   — Neon API key (for dev branch reset)

env:
  NODE_VERSION: "22"
  NEON_PROJECT_ID: "flat-bird-55654203"
  NEON_ORG_ID: "org-cool-hat-59377226"

steps:
  - label: ":no_entry_sign: Pipeline disabled"
    command: |
      echo "This pipeline is intentionally disabled."
      echo "Production cut over to Postgres on 2026-05-03; nightly MySQL→Neon import"
      echo "and gap report are no longer required."
      echo "Re-enable by restoring the original steps from git history if needed."
    agents:
      queue: "default"
