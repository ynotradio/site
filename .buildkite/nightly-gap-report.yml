# Buildkite Pipeline for Nightly Import & Gap Report
#
# 1. Runs incremental import (prod MySQL → prod Neon) to import new records
# 2. Posts an import summary as a comment on the tracking GitHub issue
# 3. Generates a gap report comparing MySQL vs Neon
# 4. Updates the GitHub issue body with the gap report
#
# Note: Configure this as a scheduled build in Buildkite UI:
# Schedule: 0 3 * * * (cron format: daily at 3 AM UTC)
# Branch: master
#
# Required Buildkite secrets (set via Buildkite UI → Pipeline → Secrets):
#   PROD_MYSQL_HOST        — Production MySQL hostname
#   PROD_MYSQL_USER        — Production MySQL username
#   PROD_MYSQL_PASSWORD    — Production MySQL password
#   PROD_MYSQL_DATABASE    — Production MySQL database name (default: ynot_site)
#   NEON_PROD_DATABASE_URL — Production Neon/PostgreSQL connection string
#   GITHUB_PR_TOKEN        — Fine-grained PAT with issues:write permission
#   GAP_REPORT_ISSUE_NUMBER — GitHub issue number to update with results

env:
  NODE_VERSION: "22"

steps:
  - label: ":package: Import & :bar_chart: Gap Report"
    key: "import-and-gap-report"
    timeout_in_minutes: 30
    command: |
      echo "--- :yarn: Installing dependencies"
      corepack enable && yarn install --immutable

      echo "--- :package: Running incremental import (prod-mysql → prod-neon)"
      IMPORT_FAILED=""
      node --import ./bin/preload-nextenv-fix.mjs --import tsx bin/incremental-import.ts \
        --from prod-mysql \
        --to prod-neon \
        --reset \
        --output /tmp/import-summary.md \
        --verbose || IMPORT_FAILED=1

      echo "--- :speech_balloon: Posting import summary comment"
      if [ -f /tmp/import-summary.md ]; then
        node .buildkite/scripts/post-import-summary-comment.mjs /tmp/import-summary.md || true
      else
        echo "⚠️ No import summary file found, skipping comment"
      fi

      echo "--- :bar_chart: Running gap report (prod-mysql → prod-neon)"
      node --import ./bin/preload-nextenv-fix.mjs --import tsx bin/migrations/importGapReport.ts \
        --from prod-mysql \
        --to prod-neon \
        --output /tmp/gap-report.md \
        --verbose

      echo "--- :github: Updating GitHub issue #$$GAP_REPORT_ISSUE_NUMBER"
      node .buildkite/scripts/update-gap-report-issue.mjs /tmp/gap-report.md

      if [ "$IMPORT_FAILED" = "1" ]; then
        echo "⚠️ Import step failed (see above), but gap report was updated."
        exit 1
      fi
    plugins:
      - docker#v5.11.0:
          image: "node:22-slim"
          propagate-environment: true
          environment:
            - "PROD_MYSQL_HOST"
            - "PROD_MYSQL_USER"
            - "PROD_MYSQL_PASSWORD"
            - "PROD_MYSQL_DATABASE"
            - "NEON_PROD_DATABASE_URL"
            - "GITHUB_PR_TOKEN"
            - "GAP_REPORT_ISSUE_NUMBER"
    agents:
      queue: "default"

  - wait: ~
    continue_on_failure: true

  - label: ":memo: Annotate on Failure"
    command: |
      buildkite-agent annotate \
        "⚠️ Nightly import/gap report failed. Check logs for details." \
        --style "warning" \
        --context "gap-report-failure"
    if: build.state == "failed"
    agents:
      queue: "default"
