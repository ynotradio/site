# Buildkite Pipeline for Y-Not Radio Site
#
# E2E tests now working with Payload CMS and Legacy PHP site
# Uses Docker-in-Docker with workarounds for esbuild and Chromium DNS

env:
  NODE_VERSION: "24"
  PHP_VERSION: "7.4"
  CI: "true"
  # Set to "true" by check-changes.sh for PR builds when no PHP/JS files changed.
  # Enables steps to exit early and save build minutes.
  SKIP_PHP: "false"
  SKIP_JS: "false"

steps:
  # Conditionally trigger Docker image builds when Dockerfiles change on main/master
  - label: ":docker: Trigger Image Builds"
    key: "trigger-image-builds"
    branches: "master"
    command: |
      # Check if any Dockerfiles changed
      CHANGED_FILES=$$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
      
      if echo "$$CHANGED_FILES" | grep -qE "Dockerfile\.|bin/docker/.*/Dockerfile"; then
        echo "Dockerfile changes detected, triggering image build pipeline"
        buildkite-agent pipeline upload .buildkite/build-images.yml
      else
        echo "No Dockerfile changes, skipping image builds"
      fi
    agents:
      queue: "default"

  # ESLint
  - label: ":eslint: ESLint"
    key: "eslint"
    command: "corepack enable && yarn install --immutable && yarn lint"
    plugins:
      - docker#v5.11.0:
          image: "node:24-slim"
          propagate-environment: true
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 255
          limit: 1
    agents:
      queue: "default"

  # Vitest Unit Tests
  - label: ":test_tube: Vitest Tests"
    key: "vitest"
    command: "corepack enable && yarn install --immutable && yarn test:coverage"
    plugins:
      - docker#v5.11.0:
          image: "node:24-slim"
          propagate-environment: true
    artifact_paths:
      - "coverage/**/*"
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 255
          limit: 1
    agents:
      queue: "default"

  # Storybook Build + Deploy Preview (deploys to Netlify via API, posts PR comment)
  # soft_fail: Netlify deploy issues should not block PR merges
  - label: ":storybook: Storybook Build & Deploy"
    key: "storybook"
    soft_fail: true
    command: "bash .buildkite/scripts/build-storybook.sh"
    plugins:
      - docker#v5.11.0:
          image: "node:24-slim"
          propagate-environment: true
          environment:
            - "NETLIFY_AUTH_TOKEN"
            - "GITHUB_PR_TOKEN"
    agents:
      queue: "default"

  # Storybook Accessibility Tests (axe-core via Vitest + Playwright browser mode)
  # soft_fail: a11y issues are visible in CI output but never block a merge.
  # Fix violations progressively; override parameters.a11y.test = 'todo' on a
  # per-story basis for known issues that are not yet remediated.
  - label: ":wheelchair: Storybook A11y Tests"
    key: "storybook-a11y"
    soft_fail: true
    command: |
      corepack enable && yarn install --immutable && \
      npx playwright install --with-deps chromium && \
      yarn test:storybook
    plugins:
      - docker#v5.11.0:
          image: "node:24"
          propagate-environment: true
    agents:
      queue: "default"

  # PHP Lint (CodeSniffer) — skipped on JS-only PRs
  # Runs inside the pinned PHP_VERSION image (php:7.4-fpm, same base prod
  # runs — see bin/docker/phpfpm/Dockerfile) instead of composer:2, which
  # tracks latest PHP and would silently pass code that fatals on prod's
  # actual PHP 7.4 (e.g. trait constants, which need PHP 8.2+).
  - label: ":php: PHP Lint"
    key: "php-lint"
    command: |
      if [ "$${SKIP_PHP}" = "true" ]; then echo "No PHP changes — skipping."; exit 0; fi
      bash .buildkite/scripts/run-php-checks.sh lint
    env:
      GHCR_USERNAME: "${GHCR_USERNAME}"
      GHCR_TOKEN: "${GHCR_TOKEN}"
    agents:
      queue: "default"
      docker: "true"

  # PHP Unit Tests — skipped on JS-only PRs
  # See php-lint above re: pinned PHP_VERSION image.
  - label: ":php: PHP Unit Tests"
    key: "php-test"
    command: |
      if [ "$${SKIP_PHP}" = "true" ]; then echo "No PHP changes — skipping."; exit 0; fi
      bash .buildkite/scripts/run-php-checks.sh test
    env:
      GHCR_USERNAME: "${GHCR_USERNAME}"
      GHCR_TOKEN: "${GHCR_TOKEN}"
    agents:
      queue: "default"
      docker: "true"

  # === E2E Integration Tests ===
  # Only run after all fast checks pass — saves ~20 min on doomed builds.
  - label: ":playwright: E2E Tests"
    key: "e2e"
    skip: "Temporarily disabled across branches"
    depends_on:
      - "eslint"
      - "vitest"
      - "php-lint"
      - "php-test"
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: -1   # agent lost
          limit: 2
        - exit_status: 255  # infrastructure issue
          limit: 1
    command: "bash .buildkite/scripts/run-e2e.sh"
    env:
      GHCR_USERNAME: "${GHCR_USERNAME}"
      GHCR_TOKEN: "${GHCR_TOKEN}"
    artifact_paths:
      - "test-results/**/*"
      - "playwright-report/**/*"
    agents:
      queue: "default"
      docker: "true"

  # === Failure annotation (same pattern as nightly/db-sync pipelines) ===
  - wait: ~
    continue_on_failure: true

  - label: ":memo: Annotate on Failure"
    command: |
      buildkite-agent annotate \
        "❌ CI failed. Check the failed steps above for details." \
        --style "error" \
        --context "ci-failure"
    if: build.state == "failed"
    agents:
      queue: "default"
