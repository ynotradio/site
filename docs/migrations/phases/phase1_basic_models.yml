        type: varchar(48)
        nullable: false
      note:
        type: text
        nullable: false
      deleted:
        type: varchar(3)
        nullable: false

  YearEndStaffPick:
    table: year_end_staff_picks
    related_tables:
      - yearendstaff
    fields:
      id:
        type: int
        nullable: false
        primary_key: true
        auto_increment: true
      order_id:
        type: int
        nullable: false
      html:
        type: longtext
        nullable: false
      deleted:
        type: char(1)
        nullable: false

# Migration Notes:
# 1. These models are relatively simple with straightforward data structures
# 2. Most models have a 'deleted' field to support soft deletion
# 3. All models have a corresponding Factory class for creation and retrieval operations
