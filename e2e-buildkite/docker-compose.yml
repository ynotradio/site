# Buildkite E2E Docker Compose
# Full setup: Postgres + MySQL → Payload + Legacy PHP → Playwright
#
# Pre-built images (ghcr.io/ynotradio/site/*) are used when available.
# Set GHCR_ORG env var to use pre-built images, otherwise builds locally.

services:
  # === PostgreSQL for Payload CMS ===
  postgres:
    image: ${GHCR_ORG:+ghcr.io/${GHCR_ORG}/postgres-seeded:latest}${GHCR_ORG:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ynot_payload_dev
      POSTGRES_USER: ynot_postgres_user
      POSTGRES_PASSWORD: ynot_postgres_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ynot_postgres_user -d ynot_payload_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  # === MySQL for Legacy PHP Site ===
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ynot_site
      MYSQL_USER: ynot_sql_user
      MYSQL_PASSWORD: ynot_sql_pass
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # === Payload CMS ===
  # Uses pre-built image with node_modules when GHCR_ORG is set
  payload:
    image: ${GHCR_ORG:+ghcr.io/${GHCR_ORG}/payload-dev:latest}${GHCR_ORG:-node:22-slim}
    working_dir: /app
    volumes:
      - ..:/app
    ports:
      - "3000:3000"
    environment:
      - CI=true
      - NODE_ENV=development
      - DATABASE_URI=postgresql://ynot_postgres_user:ynot_postgres_pass@postgres:5432/ynot_payload_dev
      - DATABASE_SSL=disable
      - PAYLOAD_SECRET=testsecretkey1234567890
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
        # If no node_modules (fallback image), install deps
        if [ ! -d node_modules ]; then
          apt-get update && apt-get install -y curl git &&
          corepack enable &&
          yarn install --frozen-lockfile --ignore-engines
        fi
        echo '✅ Starting dev server...' &&
        yarn dev
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/admin/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # === PHP-FPM for Legacy Site ===
  # Uses pre-built image with extensions already installed
  phpfpm:
    image: ${GHCR_ORG:+ghcr.io/${GHCR_ORG}/phpfpm-dev:latest}${GHCR_ORG:-php:7.4-fpm}
    working_dir: /app
    volumes:
      - ../src:/app
    environment:
      # MySQL connection (matches PHP $_ENV vars)
      - DB_HOST=mysql
      - DB_USER=ynot_sql_user
      - DB_PASSWORD=ynot_sql_pass
      - DB_NAME=ynot_site
      - DB_PORT=3306
      # PostgreSQL connection
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=ynot_payload_dev
      - POSTGRES_USER=ynot_postgres_user
      - POSTGRES_PASSWORD=ynot_postgres_pass
      - USE_POSTGRES_SCHEDULE=false
      # Auth0 dummy config (prevents SDK init errors in E2E tests)
      - AUTH0_DOMAIN=test.auth0.com
      - AUTH0_CLIENT_ID=test-client-id
      - AUTH0_CLIENT_SECRET=test-client-secret
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      bash -c "
        # Install extensions if using fallback image
        if ! php -m | grep -q mysqli; then
          apt-get update && apt-get install -y libpq-dev unzip curl &&
          docker-php-ext-install pdo pdo_pgsql pdo_mysql mysqli &&
          echo 'clear_env = no' >> /usr/local/etc/php-fpm.d/www.conf &&
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        fi
        composer install --no-interaction --no-dev &&
        php-fpm
      "
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s

  # === Apache for Legacy Site ===
  apache:
    image: httpd:2.4
    ports:
      - "8080:80"
    volumes:
      - ../src:/app
      - ../bin/docker/apache-vhost/httpd-vhost.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf
    depends_on:
      phpfpm:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: >
      sh -c "
        echo 'LoadModule proxy_module modules/mod_proxy.so' >> /usr/local/apache2/conf/httpd.conf &&
        echo 'LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so' >> /usr/local/apache2/conf/httpd.conf &&
        echo 'LoadModule rewrite_module modules/mod_rewrite.so' >> /usr/local/apache2/conf/httpd.conf &&
        echo 'Include conf/extra/httpd-vhosts.conf' >> /usr/local/apache2/conf/httpd.conf &&
        httpd-foreground
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # === Playwright E2E Tests ===
  # Uses pre-built image with node_modules when GHCR_ORG is set
  playwright:
    image: ${GHCR_ORG:+ghcr.io/${GHCR_ORG}/playwright:latest}${GHCR_ORG:-mcr.microsoft.com/playwright:v1.58.2-noble}
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      - CI=true
      - PLAYWRIGHT_BASE_URL=http://payload:3000
      - PLAYWRIGHT_LEGACY_URL=http://apache:80
      - SKIP_PAYLOAD_SEED=true
    depends_on:
      payload:
        condition: service_healthy
      apache:
        condition: service_healthy
    command: >
      bash -c "
        echo '🔍 Testing connectivity from Playwright container...'
        curl -sf http://payload:3000/admin/login > /dev/null && echo '✅ Payload reachable' || echo '❌ Payload unreachable'
        curl -sf http://apache:80/ > /dev/null && echo '✅ Apache reachable' || echo '❌ Apache unreachable'
        
        # Install deps if not using pre-built image
        if [ ! -d node_modules ]; then
          npm install --legacy-peer-deps
        fi
        npx playwright test --reporter=list
      "
