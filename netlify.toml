[build]
  # `yes |` auto-accepts Payload's "dev mode detected" interactive prompt,
  # which defaults to No on non-interactive CI and silently skips pending
  # migrations (causing the build to hang until Netlify times out).
  # `--forceAcceptWarning` alone does NOT suppress this specific prompt.
  # Do not remove the `yes |` prefix.
  command = "yarn validate:migrations && yes | yarn payload:migrate && yarn build"
  publish = ".next"
  ignore = "./scripts/netlify-ignore.sh"

[functions]
  # Externalize lexical packages to prevent esbuild from bundling them as CJS
  # These packages use top-level await and import.meta which require ESM
  external_node_modules = [
    "lexical",
    "@lexical/clipboard",
    "@lexical/code",
    "@lexical/devtools-core",
    "@lexical/dragon",
    "@lexical/hashtag",
    "@lexical/headless",
    "@lexical/history",
    "@lexical/html",
    "@lexical/link",
    "@lexical/list",
    "@lexical/mark",
    "@lexical/markdown",
    "@lexical/offset",
    "@lexical/overflow",
    "@lexical/plain-text",
    "@lexical/react",
    "@lexical/rich-text",
    "@lexical/selection",
    "@lexical/table",
    "@lexical/text",
    "@lexical/utils",
    "@lexical/yjs"
  ]

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "11"
  YARN_VERSION = "1.22.22"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[dev]
  command = "npm run dev"
  port = 3000
  autoLaunch = false

# Netlify Next.js Runtime automatically handles:
# - Server-side rendering
# - API routes (/app/api/*)
# - Image optimization
# - Incremental static regeneration

[context.production.environment]
  PAYLOAD_PUBLIC_SERVER_URL = "https://admin.ynotradio.net"
  PAYLOAD_CORS = "https://admin.ynotradio.net,https://ynotradio-admin.netlify.app,https://www.ynotradio.net,https://ynotradio.net"
  PAYLOAD_CSRF = "https://admin.ynotradio.net,https://ynotradio-admin.netlify.app"
  DATABASE_SSL = "require"
  # DATABASE_URI and PAYLOAD_SECRET are configured via Netlify dashboard

# Payload CSRF/CORS are EXACT string matches (no glob support), so the
# dynamic per-deploy origin (https://<branch>--ynotradio-admin.netlify.app or
# https://deploy-preview-<n>--...) cannot be listed statically here. It is
# appended at runtime from $DEPLOY_PRIME_URL in payload.config.ts. The static
# values below only need the stable custom preview domain.
[context.deploy-preview.environment]
  PAYLOAD_PUBLIC_SERVER_URL = "https://preview-admin.ynotradio.net"
  PAYLOAD_CORS = "https://preview-admin.ynotradio.net"
  PAYLOAD_CSRF = "https://preview-admin.ynotradio.net"
  DATABASE_SSL = "require"
  # DATABASE_URI and PAYLOAD_SECRET are configured via Netlify dashboard

# Branch deploys (non-PR pushes) get the same treatment; the dynamic origin
# comes from $DEPLOY_PRIME_URL at runtime via payload.config.ts.
[context.branch-deploy.environment]
  PAYLOAD_PUBLIC_SERVER_URL = "https://preview-admin.ynotradio.net"
  PAYLOAD_CORS = "https://preview-admin.ynotradio.net"
  PAYLOAD_CSRF = "https://preview-admin.ynotradio.net"
  DATABASE_SSL = "require"
  # DATABASE_URI and PAYLOAD_SECRET are configured via Netlify dashboard

