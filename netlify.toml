[build]
  command = "npm run build"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 3000
  autoLaunch = false

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]
  included_files = ["payload/media/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/payload"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/payload"
  status = 200
  force = true

[context.production.environment]
  PAYLOAD_PUBLIC_SERVER_URL = "https://admin.ynotradio.net"
  DATABASE_SSL = "require"

[context.deploy-preview.environment]
  PAYLOAD_PUBLIC_SERVER_URL = "https://preview-admin.ynotradio.net"
  DATABASE_SSL = "require"
